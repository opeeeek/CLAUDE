<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BM-Win · Statyka</title>
<link rel="stylesheet" href="../shared/bm.css">
<link rel="stylesheet" href="../shared/bm-app.css">
<link rel="stylesheet" href="statyka.css">
</head>
<body>
<header id="top">
  <a class="brand" href="../index.html" title="Ekran główny BM-Win">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="3" style="fill:var(--brand1);stroke:var(--brand2)"/><path d="M7 24 L7 10 L25 10 L25 24" fill="none" stroke-width="2.4" style="stroke:var(--brand4)"/><path d="M7 10 L16 4 L25 10" fill="none" stroke-width="1.6" style="stroke:var(--brand3)"/><circle cx="7" cy="24" r="1.8" style="fill:var(--brand5)"/><circle cx="25" cy="24" r="1.8" style="fill:var(--brand5)"/></svg>
    <b>Statyka</b><span class="tag" id="dimTag">2D</span>
  </a>
  <input id="projName" title="Nazwa projektu" aria-label="Nazwa projektu" spellcheck="false">
  <span id="fileName"></span>
  <div class="tb">
    <button data-act="new" title="Nowy projekt (Ctrl+N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="lbl">Nowy</span></button>
    <button data-act="open" title="Otwórz projekt (Ctrl+O)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl">Otwórz</span></button>
    <button data-act="save" title="Zapisz (Ctrl+S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span class="lbl">Zapisz</span></button>
    <button data-act="saveas" title="Zapisz jako (Ctrl+Shift+S)"><span class="lbl">Zapisz jako…</span></button>
    <span class="sep"></span>
    <button data-act="undo" title="Cofnij (Ctrl+Z)" aria-label="Cofnij">↶</button>
    <button data-act="redo" title="Ponów (Ctrl+Y)" aria-label="Ponów">↷</button>
    <span class="sep"></span>
    <button data-act="print" title="Drukuj raport / zapisz do PDF (Ctrl+P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M7 14h10v7H7z"/></svg><span class="lbl">Drukuj / PDF</span></button>
    <button data-act="odt" title="Raport w formacie ODT (LibreOffice / Word)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 15h6M9 18h4"/></svg><span class="lbl">ODT</span></button>
    <button data-act="dxf" title="Eksport schematu (i bieżącego wykresu) do DXF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 L10 8 L14 14 L20 4"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/></svg><span class="lbl">DXF</span></button>
    <button data-act="about" title="O programie" aria-label="O programie">?</button>
  </div>
  <div id="status">…</div>
</header>
<main>
  <section id="out">
    <nav class="tabs">
      <button data-tab="model" class="on">Model</button>
      <button data-tab="loads">Obciążenia</button>
      <button data-tab="combos">Kombinacje</button>
      <button data-tab="results">Wyniki</button>
      <button data-tab="report">Raport</button>
    </nav>
    <div class="pane on" id="p-work">
      <div class="work">
        <div class="wleft" id="wleft"></div>
        <div class="wright">
          <div class="vbar" id="vbar"></div>
          <div id="view" tabindex="0"></div>
          <div class="vfoot" id="vfoot"></div>
        </div>
      </div>
    </div>
    <div class="pane" id="p-combos"></div>
    <div class="pane" id="p-report"></div>
  </section>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script src="../shared/bm-core.js"></script>
<script src="../shared/bm-materials.js"></script>
<script src="../shared/bm-sections.js"></script>
<script src="../shared/bm-export.js"></script>
<script src="fem.js"></script>
<script src="view.js"></script>
<script src="generators.js"></script>
<script src="report.js"></script>
<script src="ui.js"></script>
</body>
</html>
