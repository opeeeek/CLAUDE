<!doctype html>
<html lang="pl">
<head>
<script src="../shared/bm-legacy.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BelkaŻB</title>
<style id="appcss">/* Układ: aplikacja dwupanelowa – dane po lewej, wyniki po prawej; na telefonie przełącznik Dane / Wyniki. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e8ebef;
  --ink: #1b2230; --ink2: #4a5466; --ink3: #7a8494;
  --acc: #1d5bb8; --acc2: #e8f0fc; --acc3: #0f3f86; --onacc: #ffffff; --focus: #8fb2ea;
  --ok: #1d7f3c; --okbg: #e6f4ea; --warn: #a35d00; --warnbg: #fdf1dc; --fail: #c0262d; --failbg: #fde8e8; --info: #5b6576; --infobg: #eef0f3;
  --errln: #f3c2c4; --wrnln: #f0d6a8; --ubbg: #edf0f3; --ubwarn: #d89a2b;
  --field: #ffffff; --hover: #e3e7ed; --grp: #f2f5f9; --itembg: #fbfcfe; --addln: #a9c3ec; --addhov: #d6e5fb; --dashln: #b9c6da;
  --shadow: rgba(20, 30, 50, .18); --scrim: rgba(15, 22, 35, .45); --toastbg: #1d2636; --toastink: #ffffff;
  --hdr: #172235; --hdr2: #22314b; --hdrln: #34486b; --hdrhov: #24344f; --hdrbot: #0b1220;
  --hdrink: #e9eef6; --hdrink2: #dbe4f2; --hdrmut: #8ea2c2; --hdrtag: #b8c7de; --hdrtagln: #4e6386; --hdrfocus: #5d8fe0;
  --stok: #1f6b3a; --stfail: #a8232a; --stwarn: #8a5300; --onst: #ffffff;
  --brand1: #dfe6f1; --brand2: #9fb3d4; --brand3: #b5413f; --brand4: #172235; --brand5: #3b5b8f;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ui: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Liberation Sans", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
    --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
    --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
    --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
    --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
    --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
    --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
  --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
  --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
  --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
  --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
  --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
  --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--ui); color: var(--ink); background: var(--bg); overflow: hidden; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr); }
button { font: inherit; }
sub, sup { font-size: 72%; line-height: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- pasek górny */
#top { min-height: 50px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; background: var(--hdr); color: var(--hdrink); border-bottom: 1px solid var(--hdrbot); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
.brand b { font-weight: 650; letter-spacing: .2px; }
.brand .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--hdrtagln); border-radius: 3px; color: var(--hdrtag); }
#projName { width: 190px; background: var(--hdr2); border: 1px solid var(--hdrln); color: var(--hdrink); padding: 5px 8px; border-radius: 4px; font: inherit; }
#projName:focus { outline: 2px solid var(--hdrfocus); outline-offset: -1px; }
.tb { display: flex; gap: 4px; align-items: center; }
.tb button { background: transparent; color: var(--hdrink2); border: 1px solid transparent; padding: 6px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb button:hover { background: var(--hdrhov); border-color: var(--hdrln); }
.tb button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.tb .sep { width: 1px; height: 22px; background: var(--hdrln); margin: 0 4px; }
#status { margin-left: auto; padding: 6px 12px; border-radius: 4px; font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--onst); background: var(--hdr2); }
#status.ok { background: var(--stok); } #status.fail { background: var(--stfail); } #status.warn { background: var(--stwarn); }
#fileName { color: var(--hdrmut); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- układ */
main { display: flex; height: calc(100% - 50px); }
#inputs { min-width: 0; columns: 2 400px; column-gap: 16px; }
#inputs details.grp { break-inside: avoid; display: block; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.datawrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
#dataside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
#dataside .box { padding: 10px 12px; }
#dataside .schemewrap svg { width: 100%; height: auto; }
#dataside .hint { margin: 6px 0 0; }
.schemesvg .supp { cursor: pointer; }
.schemesvg .supp:hover .suphl { fill: var(--acc2); stroke: var(--acc); }
.secedit .zhit { cursor: pointer; }
.secedit .zhit:hover { fill: var(--acc); fill-opacity: .14; stroke: var(--acc); stroke-dasharray: 4 3; }
.rebbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.rebbar .ttl { font-weight: 650; color: var(--acc3); margin-right: 4px; font-size: 12.5px; }
.rebbar select { width: auto; height: 28px; }
.zed { display: flex; flex-direction: column; gap: 8px; }
.zed .zl { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel2); }
.zed .zl h5 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); display: flex; align-items: center; gap: 8px; }
.zed .zl h5 .sp { flex: 1; }
.zed .zg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; font-size: 12.5px; color: var(--ink2); }
.zed .zg select { width: auto; height: 26px; }
.zed .zg .txt { height: 26px; width: 74px; text-align: right; }
.zed .zg .txt.wide { width: 220px; text-align: left; }
.zed .iss { font-size: 12px; color: var(--fail); }
.zed .okm { font-size: 12px; color: var(--ok); }
.dlg.zpop { max-width: 980px !important; }
.zpop .zcols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.zpop .zprev { position: sticky; top: 0; }
.zpop .fields { display: block; }
.suppop .zg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.suppop label.rad { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; flex: 1 1 180px; }
.suppop label.rad.on { border-color: var(--acc); background: var(--acc2); }
.suppop .txt { width: 110px; height: 28px; text-align: right; }
.suppop label.rad svg { flex: none; }
.suppop label.rad small { color: var(--ink3); }
.suptab { margin-top: 6px; }
.suptab tr { cursor: pointer; }
.suptab tr:hover td { background: var(--acc2); }
.suptab td { font-size: 12px; padding: 3px 6px; }
.kv.suptab td:nth-child(2) { text-align: left; font-weight: 400; }
.kv.suptab td:nth-child(3) { white-space: nowrap; }
.zprev table.kv td:nth-child(2) { white-space: nowrap; }
.rebbar label.vib { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); margin-left: auto; }
.rebbar .btn.sm { text-align: left; }
.dlg.fpop { max-width: 620px; }
.dlg.fpop .fields { padding: 0; }
.minisec svg { max-width: 100%; height: auto; }
.zed .hint { margin: 2px 0; }
#out { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- formularz */
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; font-weight: 650; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--acc3); background: var(--panel2); display: flex; align-items: center; gap: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
.fields { padding-block: 6px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.row { display: grid; grid-template-columns: 1fr 156px 38px; align-items: center; gap: 6px; min-height: 30px; }
.row label { color: var(--ink2); font-size: 12.5px; }
.row .unit { color: var(--ink3); font-size: 11.5px; }
.row.wide { grid-template-columns: 1fr 218px; }
.hint { font-size: 11.5px; color: var(--ink3); margin: 0 0 6px; padding-left: 2px; }
.hint b { color: var(--ink2); font-weight: 600; }
select, .combo input, .txt, .mtab input { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font: inherit; color: var(--ink); padding: 0 6px; width: 100%; }
select:focus, .combo input:focus, .txt:focus, .mtab input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--acc); }
select { padding-right: 2px; }
.combo { display: flex; position: relative; }
.combo input { border-radius: 4px 0 0 4px; text-align: right; padding-right: 6px; }
.combo button { width: 24px; border: 1px solid var(--line); border-left: 0; background: var(--panel2); border-radius: 0 4px 4px 0; cursor: pointer; color: var(--ink2); padding: 0; }
.combo button:hover { background: var(--acc2); }
.combo input.bad, .txt.bad, .mtab input.bad { border-color: var(--fail); background: var(--failbg); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--ink2); font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); flex: none; }
.barrow { display: grid; grid-template-columns: 1fr 60px 14px 74px 38px; align-items: center; gap: 4px; min-height: 30px; }
.barrow .x { text-align: center; color: var(--ink3); }
.barrow label { color: var(--ink2); font-size: 12.5px; }
.mtab { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.mtab th { font-weight: 500; color: var(--ink3); font-size: 11.5px; padding: 2px; text-align: center; }
.mtab td { padding: 2px; }
.mtab td:first-child { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.mtab input { height: 25px; text-align: right; padding: 0 5px; }
#pop { position: fixed; z-index: 130; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); border-radius: 4px; max-height: 260px; overflow-y: auto; display: none; min-width: 120px; }
#pop div { padding: 4px 10px; cursor: pointer; text-align: right; }
#pop div:hover, #pop div.cur { background: var(--acc2); color: var(--acc3); }

/* ---------- zakładki */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-block: 8px 0; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-radius: 5px 5px 0 0; font-weight: 550; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--panel); border-color: var(--line); color: var(--acc3); margin-bottom: -1px; }
.pane { display: none; flex: 1; overflow: auto; background: var(--panel); padding-block: 16px 30px; padding-left: 18px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pane.on { display: block; }
.tscroll { max-width: 100%; overflow-x: auto; }

/* ---------- podsumowanie */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); position: relative; overflow: hidden; min-width: 0; }
.card .t { font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 3px; }
.card .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.ok::before { background: var(--ok); } .card.fail::before { background: var(--fail); } .card.warn::before { background: var(--warn); }
.msgs { margin: 0 0 14px; }
.msg { padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; }
.msg.err { background: var(--failbg); color: var(--fail); border: 1px solid var(--errln); }
.msg.wrn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--wrnln); }
table.ctab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ctab th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); position: sticky; top: -16px; z-index: 1; }
table.ctab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.ctab tr.g td { background: var(--grp); font-weight: 650; color: var(--acc3); padding-top: 9px; font-size: 12px; letter-spacing: .2px; }
table.ctab td.ref { color: var(--ink3); white-space: nowrap; font-size: 11.5px; }
table.ctab td.val { white-space: nowrap; text-align: right; font-family: var(--ui); }
table.ctab td.nt { color: var(--ink3); font-size: 11.5px; }
.ub { width: 120px; height: 8px; background: var(--ubbg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ub i { display: block; height: 100%; background: var(--ok); }
.ub.warn i { background: var(--ubwarn); } .ub.fail i { background: var(--fail); }
.pct { display: inline-block; width: 48px; text-align: right; margin-left: 6px; font-weight: 600; font-size: 12px; }
.st { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }
.st.ok { background: var(--okbg); color: var(--ok); } .st.fail { background: var(--failbg); color: var(--fail); } .st.warn { background: var(--warnbg); color: var(--warn); } .st.info { background: var(--infobg); color: var(--info); }

/* ---------- przekroje i wykresy */
.h2 { font-size: 14px; font-weight: 650; margin: 4px 0 10px; color: var(--ink); text-wrap: balance; }
.h2 small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.flex { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.flex > * { min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); max-width: 100%; overflow-x: auto; }
.box h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); }
svg text { font-family: var(--ui); }
.kv { border-collapse: collapse; font-size: 12.5px; }
.kv td { padding: 2px 10px 2px 0; }
.kv td:first-child { color: var(--ink2); }
.kv td:nth-child(2) { text-align: right; font-weight: 600; }
.kv td:nth-child(3) { color: var(--ink3); }
table.sched { border-collapse: collapse; font-size: 12.5px; margin-top: 10px; min-width: 640px; }
table.sched th, table.sched td { border: 1px solid var(--line); padding: 4px 8px; }
table.sched th { background: var(--panel2); font-weight: 600; color: var(--ink2); font-size: 12px; }
table.sched td.n { text-align: right; }
table.sched tr.tot td { font-weight: 700; background: var(--panel2); }

/* ---------- raport */
#report { max-width: 980px; margin: 0 auto; font-size: 12.5px; color: #000; background: #fff; padding: 18px 22px; border-radius: 4px;
  --ok: #1d7f3c; --warn: #a35d00; --fail: #c0262d; --info: #5b6576; --ink: #000; --ink2: #000; --ink3: #000; }
#report h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
#report h2 { font-size: 15px; margin: 22px 0 8px; padding: 4px 0 0; color: #000; page-break-after: avoid; }
#report h3 { font-size: 13px; margin: 14px 0 6px; color: #000; page-break-after: avoid; }
#report p { margin: 4px 0 6px; }
#report .eq { padding: 2px 0 2px 14px; line-height: 1.7; page-break-inside: avoid; overflow-wrap: anywhere; color: #000; }
#report .eq .r { color: #000; font-size: 11px; margin-left: 8px; }
#report .eq b { color: #000; }
#report .eq .ok, #report .ok { color: var(--ok); font-weight: 700; } #report .eq .fail, #report .fail { color: var(--fail); font-weight: 700; } #report .eq .warn, #report .warn { color: var(--warn); font-weight: 700; }
#report .info { color: var(--info); font-weight: 700; }
#report .note { color: #000; font-size: 11.5px; font-style: italic; }
#report .fig { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; page-break-inside: avoid; max-width: 100%; overflow-x: auto; }
#report .verdict { margin-top: 16px; font-weight: 700; font-size: 13px; }
.rtools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; max-width: 980px; margin: 0 auto 8px; }
.rtools .hint { margin: 0 auto 0 0; max-width: 520px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--acc2); border-color: var(--addln); }
.btn.pri { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.btn.pri:hover { background: var(--acc3); border-color: var(--acc3); color: var(--panel); }
.btn.dng { color: var(--fail); }
.btn.dng:hover { background: var(--failbg); border-color: var(--errln); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- okna dialogowe */
#modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 100; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
#modal .dlg { background: var(--panel); color: var(--ink); border-radius: 8px; padding: 20px 24px; width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; box-shadow: 0 16px 50px var(--shadow); }
#modal .dlg.sm { max-width: 420px; }
#modal h3 { margin: 0 0 8px; text-wrap: balance; }
#modal p, #modal li { font-size: 13px; color: var(--ink2); }
#modal .dbtn { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }

// minimalne wymiary przekroju wg wytycznych normy (szacunkowo, dla każdego przęsła): zginanie bez zbrojenia ściskanego (ξ ≤ ξ_eff,lim),
// A_s ≤ 0,04·A_c i pręty w ≤ 2 warstwach, krzyżulce V_Ed ≤ V_Rd,max (cot θ = 1), ugięcie L/d ≤ (L/d)_lim (7.4.2), zwichrzenie (5.9(3)),
// odporność ogniowa b ≥ b_min (EN 1992-1-2, tab. 5.5/5.6); otulina z klasy ekspozycji; ciężar własny przeliczany dla wymiarów kandydujących
function suggestDims(S0) {

  const Ra = calc(base); if (Ra.errors.length || !Ra.st || !Ra.sh) return null;
  if (Ra.st.manual) return null;

  const md = Ra.md, m = Ra.m, cov = Ra.cov, st = Ra.st, stB = Rb.st, cont = md.cont;
  const dsw = Math.max(...md.segs.map(sg => sg.stir.d)), dg = base.mat.dg;
  const cbM = Math.max(cov.cb + dsw, cov.cnom_main || 0) + 10, ctM = Math.max(cov.ct + dsw, cov.cnom_main || 0) + 10;
  const NEd = st.NEd || 0;

  const bFire = fire ? fire.c[0][0] : 0;

  const own = cont ? md.segs.filter(sg => sg.kind === 'span') : md.segs.slice(0, 1);
  const out = own.map(sg => {
    const segsZ = cont ? md.segs.filter(q => q === sg || (q.kind !== 'span' && q.adj === sg.idx)) : md.segs;
    const g0 = sg.g, T = g0.T, sw0 = g0.selfW || 1e-9;
    const maxOver = (stt, f) => { let v = 0; segsZ.forEach(q => q.nodes.forEach(k => { v = Math.max(v, f(stt, k)); })); return v; };
    const MpA = maxOver(st, (t, k) => t.MEdMax[k]), MpB = maxOver(stB, (t, k) => t.MEdMax[k]);
    const sups = [...new Set(segsZ.flatMap(q => [q.supL, q.supR]).filter(Boolean))];
    const MnA = Math.max(0, ...sups.map(p => -st.MEdMin[st.kAt(p.x)])), MnB = Math.max(0, ...sups.map(p => -stB.MEdMin[stB.kAt(p.x)]));

    const VA = Math.max(0, ...ends.map(e => e.V0)), VB = Math.max(0, ...endsB.map(e => e.V0));
    const swOn = base.loads.sw && Rb !== Ra;
    const kMp = swOn ? (MpA - MpB) / sw0 : 0, kMn = swOn ? (MnA - MnB) / sw0 : 0, kV = swOn ? (VA - VB) / sw0 : 0;
    const Lsp = sg.L, isCant = sg.kind !== 'span';

    if (isCant) K = 0.4; else if (!cont) { const nF = md.sups.filter(p => p.type === 'fix').length; K = nF >= 2 ? 1.5 : nF === 1 ? 1.3 : 1.0; }
    else { const cL = sg.supL && (!sg.supL.end || sg.supL.type === 'fix' || sg.supL.segL !== null), cR = sg.supR && (!sg.supR.end || sg.supR.type === 'fix' || sg.supR.segR !== null); K = cL && cR ? 1.5 : (cL || cR) ? 1.3 : 1.0; }

        }

        const bas = rho <= rho0 ? K * (11 + 1.5 * sf * rho0 / rho + 3.2 * sf * Math.pow(rho0 / rho - 1, 1.5)) : K * (11 + 1.5 * sf * rho0 / rho);

    const cands = BS.filter(b => b >= bFire && (!T || b <= g0.beff)).map(minH).filter(Boolean);
    const best = cands.reduce((a, q) => (!a || q.b * q.h < a.b * a.h - 1e-6 || (Math.abs(q.b * q.h - a.b * a.h) < 1e-6 && q.h < a.h) ? q : a), null);

  });

// weryfikacja wymiarów proponowanych: dobór zbrojenia i pełne obliczenia (ugięcie metodą dokładną); w razie potrzeby h zwiększane co 50 mm

  const set = (S, hh) => { if (S.scheme === 'cont') { const md = beamModel(normalize(JSON.parse(JSON.stringify(S)))), sg = md.segs[seg]; if (!sg || sg.si === undefined) return false; S.cont.geoSpans = S.cont.geoSpans || []; for (let i = 0; i < S.cont.spans.length; i++) S.cont.geoSpans[i] = Object.assign({ b: S.geom.b, h: S.geom.h }, S.cont.geoSpans[i] || {}); S.cont.geoSpans[sg.si] = Object.assign({}, S.cont.geoSpans[sg.si], { b, h: hh }); } else { S.geom.b = b; S.geom.h = hh; } return true; };

    const fl = r.R.checks.filter(c => c.status === 'fail' && IDS.has(c.id) && (r.R.md.cont ? (c.id !== 'f' || String(c.at) === 'd' + seg) : true));

}

/* ------------------------------------------------------------ sprawdzenia */
function checks(R, S, g, m, st, cov, sh, tor, sls, anch) {
  const C = R.checks, md = R.md, secs = R.secs, LtM = R.LtM;
  const add = (grp, id, name, ref, Ed, Rd, unit, opt) => {
    opt = opt || {};
    const ratio = opt.ratio !== undefined ? opt.ratio : (Rd > 0 ? Ed / Rd : (Ed > 0 ? Infinity : 0));
    const status = opt.status || (ratio <= 1 + 1e-6 ? 'ok' : (opt.soft ? 'warn' : 'fail'));
    C.push({ grp, id, name, ref, Ed, Rd, unit, ratio, status, rel: opt.rel || '≤', note: opt.note || '', fmt: opt.fmt, at: opt.at !== undefined ? opt.at : AT });
    return C[C.length - 1];
  };
  let AT = null;                                   // miejsce sprawdzenia (przekrój / podpora / odcinek) – do raportu
  const multi = md.cont;
  const spanSegs = md.segs.filter(sg => sg.kind === 'span');
  const lbl = (sg) => multi ? ` (${sg.label})` : '';
  // --- Otulina i konstrukcja
  const gk = 'Otulina i konstrukcja';
  if (!cov.faces && cov.cb === cov.cnom && !(cov.ground && !cov.manual)) add(gk, 'cnom', 'Otulina nominalna c_nom (do strzemion)', '4.4.1', cov.reqR, cov.cnom, 'mm', { rel: '≥', note: cov.manual ? `przyjęto ręcznie; wymagane ${cov.req.toFixed(0)} mm → ${cov.reqR} mm` : `wymagane ${cov.req.toFixed(0)} mm → zaokr. ${cov.reqR} mm` });
  else [['cb', 'reqB', 'dolnej'], ['ct', 'reqT', 'górnej'], ['cs', 'reqS', 'bocznych']].forEach(([k, rq, nm]) => add(gk, 'cnom', `Otulina nominalna krawędzi ${nm} c_nom (do strzemion)`, '4.4.1', cov[rq], cov[k], 'mm', { rel: '≥', at: 'cov', note: `wymagane ${cov[rq]} mm` + (k === 'cb' && cov.ground ? ` (w tym betonowanie na podłożu ≥ ${cov.ground} mm)` : '') }));
  const mc = add(gk, 'minclass', 'Minimalna klasa betonu dla ekspozycji', 'Zał. E', classIdx(cov.minCls), classIdx(S.mat.concrete), '',
    { rel: '≥', soft: true, ratio: cov.minOk ? 0 : 1.01, status: cov.minOk ? 'ok' : 'warn', note: `${S.mat.concrete} vs min. ${cov.minCls} (${cov.minFrom})`, fmt: 'text' });
  mc.EdTxt = cov.minCls; mc.RdTxt = S.mat.concrete;

  const spacing = (nm, lay, at, top) => {
    if (!lay || !lay.n) return;
    if (!lay.ok) { add(gk, 'sp', nm, '8.2(2)', 1, 0, 'mm', { ratio: Infinity, status: 'fail', note: (lay.issues || []).join('; ') + ' – zmień rozmieszczenie, średnice lub dodaj warstwę', at }); return; }
    const l0 = lay.layers.filter(l => l.n > 1);
    if (l0.length) {
      const worst = l0.reduce((a, b) => (b.gap / b.smin < a.gap / a.smin ? b : a));
      add(gk, 'sp', nm, '8.2(2)', worst.smin, worst.gap, 'mm', { rel: '≥', at, note: `${lay.layers.length} warstw(y): ${lay.layers.map(l => l.n).join('+')} ${lay.bars.some(b => b.nb > 1) ? 'wiązek' : 'prętów'}` + (lay.layers.length > 1 ? '; pręty kolejnych warstw nad prętami warstwy 1 (8.2(4))' : '') + (lay.bundle ? `; ${lay.bundle}` : '') });
    }
    // dostęp buławy wibratora: zbrojenie górne – zawsze; dolne – gdy kilka warstw lub pręty jeden nad drugim
    if (top || lay.stacked) add(gk, 'vib', nm.replace('Rozstaw prętów', 'Prześwit na buławę wibratora –').replace(' w świetle', ''), '8.2(4)', vibReq, lay.open, 'mm', { rel: '≥', soft: true, at,
      note: `największy prześwit między ${lay.stacked && !top ? 'kolumnami prętów' : 'prętami'}; buława ⌀${S.reb.vib} mm + 10 mm luzu` });
  };
  md.segs.forEach(sg => { if (sg.kind === 'span') spacing('Rozstaw prętów dolnych w świetle' + lbl(sg), sg.Lb, 'L' + sg.idx); });
  spacing('Rozstaw prętów górnych w świetle (przęsło)', LtM, 'LtM', true);
  md.sups.forEach(p => { if (p.hasX) spacing(`Rozstaw prętów górnych w świetle (${p.name})`, p.LtS, 'T' + p.idx, true); });
  // wiązki: ⌀n ≤ 55 mm (8.9.1(2))
  {
    const dn = Math.max(...md.segs.map(sg => sg.Lb.dnMax || 0), ...md.sups.map(p => p.LtS.dnMax || 0));
    const allB = [...md.segs.flatMap(sg => sg.Lb.bars), ...md.sups.flatMap(p => p.LtS.bars)];
    if (allB.some(b => b.nb > 1)) add(gk, 'phin', 'Wiązki prętów: średnica zastępcza ⌀_n = ⌀·√n_b ≤ 55 mm', '8.9.1(2)', dn, 55, 'mm', { note: allB.some(b => b.sep) ? 'pary prętów jeden nad drugim w dobrych warunkach przyczepności – odstępy i zakotwienie jak dla prętów pojedynczych (8.9.1(4))' : 'odstępy, otulina i zakotwienie z ⌀_n, prześwit od obrysu wiązki (8.9.1(3))' });
  }
  // pręty boczne (w połowie wysokości): odstęp pionowy w świetle
  const MD = S.reb.mid;
  if (MD.n > 0 && md.segs[0].mid.length) {
    const sg0 = md.segs.find(q => q.kind === 'span') || md.segs[0], mb = sg0.mid;
    const ys = Array.from(new Set(mb.map(b => Math.round(b.y)))).sort((u, v) => u - v);
    const dT = sg0.Lt.n ? sg0.Lt.layers[0].dmax : MD.d, dB = sg0.Lb.layers[0].dmax;
    const yT = sg0.Lt.n ? sg0.Lt.layers[0].e : null, yB = sg0.g.h - sg0.Lb.layers[0].e;
    let gmin = Infinity;

  }
  secs.forEach(sec => (AT = sec.key) && add(gk, 'asmin', sec.kind === 'span' ? 'Zbrojenie dolne ≥ A_s,min' + (multi ? ` (${sec.loc})` : '') : `Zbrojenie górne ≥ A_s,min (${sec.loc})`, '9.2.1.1(1)', sec.sls ? sec.sls.AsMin : 0, sec.tens.A, 'mm²', { rel: '≥' }));

  const asmaxL = [...md.segs.map(sg => [sg.Lb.A + sg.Lt.A + (R.midA || 0), 0.04 * sg.g.Ac]), ...md.sups.map(p => [p.LbS.A + p.LtS.A + (R.midA || 0), 0.04 * p.g.Ac])];

  md.sups.filter(p => p.end && p.type !== 'fix' && (p.segL === null ? md.segs[p.segR].kind === 'span' : md.segs[p.segL].kind === 'span') && !p.sec).forEach(p => {

  }
  if (secs.some(q => q.g.h >= 1000)) {
    // 7.3.3(3): zbrojenie przypowierzchniowe boków między zbrojeniem rozciąganym a osią obojętną; A_s ≥ k_c·k·f_ct,eff·A_ct/f_yk, k = 0,5
    const sec0 = secs.filter(q => q.sls && q.g.h >= 1000).reduce((a, q) => (!a || q.sls.Mk > a.sls.Mk ? q : a), null);

    let req = 0, prov = 0, note = '';
    if (sec0) {
      const xI = sec0.sls.unS.yc, isS = sec0.kind === 'span';
      const Act = g.bw * (g.h - (isS ? xI : g.h - xI));
      req = 0.4 * 0.5 * R.m.fctm * Act / R.m.fyk;

      prov = (isS ? sec0.bars : sec0.bars).filter(b => b.side === 'mid' && (isS ? b.y > xII : b.y < g.h - xII)).reduce((a, b) => a + b.A, 0);
      note = `k = 0,5; σ_s = f_yk; pręty boczne w strefie rozciąganej (${sec0.loc})` + (S.reb.mid.n ? '' : ' – dodaj pręty boczne');
    }
    add(gk, 'skin', 'Zbrojenie przy bocznych powierzchniach (h ≥ 1000 mm)', '7.3.3(3)', req, prov, 'mm²', { rel: '≥', soft: true, note });
  }
  // zbrojenie przypowierzchniowe 9.2.4 / J.1
  {
    const sf = R.surf;
    if (!sf.req) add(gk, 'surf0', 'Zbrojenie przypowierzchniowe (siatka) – nie jest wymagane', '9.2.4, zał. J', 0, 0, '', { status: 'info', ratio: 0, note: `⌀_max = ${sf.dmax.toFixed(0)} mm ≤ 32 mm, c_nom = ${sf.cnom} mm ≤ 70 mm` });
    else if (sf.gov) {

      add(gk, 'surf', `Zbrojenie przypowierzchniowe: siatka ⌀${S.surf.d} co ${S.surf.s} mm, A_s,surf ≥ ${sf.rho === 0.01 ? '0,01' : '0,005'}·A_ct,ext`, '9.2.4, zał. J', sf.AsReq, sf.AsProv, 'mm²', { rel: '≥', note: `wymagane: ${why}; A_ct,ext = ${sf.gov.Act.toFixed(0)} mm² (${sf.gov.sec.loc}); w obu kierunkach` });

      { note: (e.red ? `V_Ed w odl. d = ${e.d.toFixed(0)} mm od lica (6.2.1(8))` : `V_Ed przy podporze bez redukcji${e.redWhy ? ' – ' + e.redWhy : ''}`) + `; ⌀${e.stir.d} ${e.stir.legs}-cięte co ${e.stir.s1} mm` + (e.Vred <= e.VRdc ? '; V_Ed ≤ V_Rd,c – wystarczy zbrojenie minimalne' : '') });

    if (tor.on && +q.stir.hookA === 90 && q.stir.kind !== 'tors') add(sg, 'Thook', 'Skręcanie: strzemiona zamknięte hakami 135° lub zakładem (haki 90° niedopuszczalne)' + sfx, '9.2.3(1), rys. 9.6', 1, 0, '', { ratio: Infinity, status: 'fail', note: 'zmień kąt haków na 135° albo rodzaj strzemion na „na skręcanie (zakład)”' });
    if (tor.on && q.stir.kind === 'open') add(sg, 'Tclosed', 'Skręcanie: strzemiona muszą być zamknięte' + sfx, '9.2.3(1)', 1, 0, '', { ratio: Infinity, status: 'fail', note: 'zmień rodzaj strzemion na zamknięte (zakład lub haki 135°)' });
  });
  AT = null;

  anch.ends.forEach(a => (AT = a.e.key) && add(sg, 'FE', `Zbrojenie dolne na podporze skrajnej (${a.name}): F_E/f_yd ≤ A_s`, '9.2.1.4(2)', a.AsReq, a.AsProv, 'mm²', { note: `F_E = ${(a.FE / 1e3).toFixed(1)} kN, a_l = ${a.aL.toFixed(0)} mm` }));

  if (tor.on) {

    add(sg, 'Tst', 'Skręcanie + ścinanie: Asw/s jednej gałęzi (strefa s₁)', '6.3.2(3)', tor.legReq1, tor.legProv1, 'mm²/mm', { rel: '≥', fmt: 3 });

  }
  R.flanges.forEach(f => {

    add(sg, 'fl1', 'Ścinanie półka–środnik: v_Ed ≤ v_Rd,max (krzyżulce w półce)' + s, '6.2.4(4)', f.vEd, f.vRdmax, 'MPa', { note: `cotθ_f = ${f.cot.toFixed(2)}, Δx = ${(f.dx / 1000).toFixed(2)} m` });

  });

  AT = null;
  const sgu = 'SGU – naprężenia', sgr = 'SGU – zarysowanie';
  const nmS = sec => multi ? sec.loc : (sec.kind === 'span' ? 'przęsło' : (md.sups.filter(p => p.sec).length > 1 ? sec.loc : 'podpora'));
  secs.forEach(sec => {
    AT = sec.key;
    const r = sec.sls; if (!r || r.Mk <= 0) return;
    const k1 = S.coef.k1, k2 = S.coef.k2, k3 = S.coef.k3, nm = nmS(sec), zz = r.biax ? ' (zginanie ukośne)' : '';
    add(sgu, 'sck', `σ_c (kombinacja charakterystyczna, ${nm}) ≤ k₁·f_ck${zz}`, '7.2(2)', r.sc_k, k1 * m.fck, 'MPa', sls.k1lim ? {} : { soft: true, status: r.sc_k <= k1 * m.fck ? 'ok' : 'info', note: 'wymagane dla klas XD, XF, XS – tu informacyjnie' });
    add(sgu, 'scqp', `σ_c (kombinacja quasi-stała, ${nm}) ≤ k₂·f_ck (pełzanie liniowe)`, '7.2(3)', r.sc_qp, k2 * m.fck, 'MPa', { soft: true, note: r.sc_qp > k2 * m.fck ? 'uwzględniono pełzanie nieliniowe 3.1.4(4)' : '' });
    add(sgu, 'ssk', `σ_s (kombinacja charakterystyczna, ${nm}) ≤ k₃·f_yk${zz}`, '7.2(5)', r.ss_k, k3 * m.fyk, 'MPa');
  });
  secs.forEach(sec => {
    AT = sec.key;
    const r = sec.sls; if (!r || r.Mk <= 0) return;
    const nm = nmS(sec);
    add(sgr, 'ascr', `Zbrojenie minimalne ze względu na rysy (${nm}) A_s ≥ A_s,min`, '7.3.2(2)', r.asmin.As, r.AsProv, 'mm²', { rel: '≥' });
    add(sgr, 'wk', `Szerokość rys w_k (${nm}) ≤ w_max`, '7.3.4', r.w.wk, sls.wmax, 'mm', { fmt: 3, note: r.crackedQP ? `s_r,max = ${r.w.sr.toFixed(0)} mm, σ_s = ${r.w.ss.toFixed(0)} MPa` + (r.biaxQP ? ' (zginanie ukośne)' : '') : 'M_qp < M_cr – przekrój niezarysowany' });
  });
  // --- SGU ugięcia
  const sgd = 'SGU – ugięcia';
  const dfl = sls.defl;
  dfl.spans.forEach(ds => {
    AT = 'd' + ds.seg.idx;
    const sfx = multi ? ` – ${ds.label}` : '';
    add(sgd, 'f', `Ugięcie długotrwałe (quasi-stałe + skurcz) f ≤ L/${S.sls.lim}${sfx}`, '7.4.1(4), 7.4.3', ds.tot.f, ds.lim, 'mm', { note: `od obciążenia ${ds.load.f.toFixed(1)} mm + od skurczu ${ds.cs.toFixed(1)} mm` + (ds.seg.kind !== 'span' ? '; wspornik: L_ref = 2·l' : '') + (dfl.patterned ? '; obciążenie zmienne na przęsłach naprzemiennych' : '') });
  });
  dfl.spans.forEach(ds => {
    AT = 'd' + ds.seg.idx;
    const ld = ds.ld; if (!ld || !isFinite(ld.lim)) return;
    add(sgd, 'ld', `Uproszczone: L/d ≤ (L/d)_lim (informacyjnie)${multi ? ' – ' + ds.label : ''}`, '7.4.2', ld.act, ld.lim, '', { soft: true, status: ld.act <= ld.lim ? 'ok' : 'info', note: `K = ${ld.K}; jeśli niespełnione – decyduje obliczenie dokładne` });
  });
  (dfl.z || []).forEach(dz => {

  });
  anch.inner.forEach(q => (AT = 'p' + q.sup.idx) && add(sga, 'inner', `Pręty dolne na podporze pośredniej (${q.sup.name}): zakotwienie ≥ 10⌀ = ${q.l.toFixed(0)} mm za licem`, '9.2.1.5(1)', 0, 0, '', { status: 'info', ratio: 0, note: 'pręty z sąsiednich przęseł łączone na zakład l₀ nad podporą (ciągłość zbrojenia dolnego, 9.2.1.5(3))' }));
  // zestawienie prętów: długość ≤ L_max (z odgięciami), zakłady nad podporami pośrednimi, ręczne odgięcia, haki strzemion
  let schC = null; try { schC = steelSchedule(R); } catch (e) { schC = null; }
  R.sched = schC;
  if (schC) {
    const LmaxC = S.anch.Lmax > 0 ? S.anch.Lmax * 1000 : Infinity;
    (schC.short || []).forEach(q => { const r = schC.rows.find(z => z.key === q.key); AT = 'bar' + q.key;
      add(sga, 'lenMan', `Długość pręta${r ? ` poz. ${r.pos} (${r.name.replace(/, odcinek.*$/, '')})` : ''} przyjęta ręcznie ≥ wymagana z zakotwienia i zasięgu zbrojenia`, '8.4.4, 9.2.1.3', q.need / 1000, q.got / 1000, 'm', { rel: '≥', note: 'pręt skrócony ręcznie nie sięga do wymaganego zakotwienia (za licem podpory / poza punkt odcięcia) – wydłuż pręt albo przywróć wymiar automatyczny' }); });
    schC.rows.filter(r => r.overMax).forEach(r => { AT = r.key ? 'bar' + r.key : null; add(sga, 'Lmax', `Długość pręta poz. ${r.pos} (${r.name}) l ≤ L_max`, '—', r.len / 1000, LmaxC / 1000, 'm', { note: 'długość rozwinięta: odcinek prosty + odgięcia' + (r.man ? '; wymiary zmienione ręcznie – skróć pręt lub dodaj zakład' : '') }); });

        add(sga, 'stepL', `Uskok belki nad podporą (${p.name}): odgięcie prętów dolnych przęsła głębszego ≥ 10⌀`, '9.2.1.5(1), rys. 9.4', 10 * deep.d, leg || 0, 'mm', { rel: '≥', note: 'pręty nie mogą wyjść poza obrys płytszego przęsła – odgięte do góry przy licu uskoku' });

      AT = 'p' + p.idx;
      add(sga, 'lapB', `Zakład prętów dolnych nad podporą pośrednią (${p.name}) l ≥ l₀`, '8.7.3, 9.2.1.5', l0r, rl.x1 - rr.x0, 'mm', { rel: '≥', note: `pręty z obu przęseł zachodzą na siebie symetrycznie względem osi podpory` + (rl.man || rr.man ? '; wymiary zmienione ręcznie' : '') });

      add(sga, 'legMan', `Odgięcie prętów dolnych przyjęte ręcznie (${a.name}) ≥ wymagane z zakotwienia`, '8.4.4, 9.2.1.4(3)', a.leg, lg, 'mm', { rel: '≥' });
    }));
    const doneH = new Set();
    md.segs.forEach(sg => { const q = sg.stir; if (!(q.hook > 0) || doneH.has(q)) return; doneH.add(q); const ss = stirSet(q, sg.g, cov, sg.hold && sg.hold.xs); AT = 'st' + sg.idx; add(sga, 'hook', `Haki strzemion 135° przyjęte ręcznie${multi ? ` (${sg.label})` : ''} ≥ max(5⌀; 50 mm)`, '8.5 (rys. 8.5)', ss.extMin, ss.ext, 'mm', { rel: '≥', note: `zalecane ${ss.extAuto} mm (10⌀, ≥ 70 mm)` }); });
  }
  (anch.topCut || []).forEach(tc => tc.sides.forEach(sd => {
    if (!sd.manual) return;

    add(sga, 'topLen', `Pręty górne dodatkowe – ${tc.sup.name}, ${sd.side === 'L' ? 'w lewo' : 'w prawo'}: długość od osi ≥ wymagana`, '9.2.1.3, 9.2.1.2(1)', sd.lenReq / 1000, sd.len / 1000, 'm', { rel: '≥', note: 'długość przyjęta ręcznie' + (sd.len > sd.lenReq + 1 ? ' (przedłużenie)' : '') });
  }));
  anch.rows.forEach(r => (AT = 'r' + r.name) && add(sga, 'lap', `${r.name}: l_bd = ${r.lbd.toFixed(0)} mm, zakład l₀ = ${r.l0.toFixed(0)} mm`, '8.4.4, 8.7.3', 0, 0, '', { status: 'info', ratio: 0, note: `przyczepność ${r.bond === 'good' ? 'dobra' : 'średnia'}, f_bd = ${r.fbd.toFixed(2)} MPa, α₆ = ${anch.alpha6}` }));

    if (g.T) add(sf, 'fbw', 'Grubość środnika b_w ≥ b_w,min (klasa WA)', 'EN 1992-1-2 5.6', f.bwMin, g.bw, 'mm', { rel: '≥' });

/* ------------------------------------------- sytuacja wyjątkowa (6.11b) */
function accChecks(R, RA) {
  const grp = 'SGN – sytuacja wyjątkowa (PN-EN 1990, 6.11b)';
  const add = (id, name, ref, Ed, Rd, unit, opt) => {
    opt = opt || {};
    const ratio = opt.ratio !== undefined ? opt.ratio : (Rd > 0 ? Ed / Rd : (Ed > 0 ? Infinity : 0));
    R.checks.push({ grp, id: 'A_' + id, name, ref, Ed, Rd, unit, ratio, status: opt.status || (ratio <= 1 + 1e-6 ? 'ok' : 'fail'), rel: opt.rel || '≤', note: opt.note || '', fmt: opt.fmt });
  };
  const st = RA.st;
  const gnote = `γ_c = ${RA.m.gc}, γ_s = ${RA.m.gs}`;
  RA.secs.forEach(sec => {
    if (sec.MEd <= 0) return;
    add('M' + sec.key, `Zginanie – ${sec.loc} |M_Ed,A| ≤ M_Rd`, '6.1', sec.MEd / 1e6, sec.r ? sec.MRd / 1e6 : 0, 'kNm', sec.r ? { note: gnote } : { ratio: Infinity, status: 'fail', note: 'N_Ed,A poza zakresem nośności' });
    if (sec.biax && sec.biax.Mz > 1e3) add('B' + sec.key, `Zginanie ukośne (Y+Z) – ${sec.loc}`, '6.1 (zginanie ukośne)', sec.biax.u, 1, '');
  });
  if (st.NEd > 0) add('N', 'Ściskanie N_Ed,A ≤ N_Rd,max', '6.1', st.NEd / 1e3, RA.NRdMax / 1e3, 'kN');
  else if (st.NEd < 0) add('N', 'Rozciąganie |N_Ed,A| ≤ N_Rd,t', '6.1', -st.NEd / 1e3, -RA.NRdMin / 1e3, 'kN');
  RA.sh.ends.forEach(e => {
    const eP = R.sh.ends.find(x => x.key === e.key);
    add('Vmax' + e.key, `Krzyżulce betonowe (${e.name}) V_Ed,A ≤ V_Rd,max` + (RA.tor.on ? ' (z T_Ed,A)' : ''), '6.2.3(3)', RA.tor.on ? e.inter : e.V0 / 1e3, RA.tor.on ? 1 : e.VRdmax / 1e3, RA.tor.on ? '' : 'kN', { note: `cotθ = ${RA.sh.cot.toFixed(2)}` });
    add('Vs' + e.key, `Strzemiona s₁ (${e.name}) V_Ed,A ≤ V_Rd,s`, '6.2.3(3)', e.Vred / 1e3, e.VRds1 / 1e3, 'kN');
    if (eP && e.l1req > 0) add('l1' + e.key, `Długość strefy s₁ (${e.name}) ≥ wymagana w sytuacji wyjątkowej`, '6.2.3', e.l1req / 1000, eP.l1 / 1000, 'm', { rel: '≥' });
  });
  RA.anch.ends.forEach(a => add('FE' + a.e.key, `Zbrojenie dolne na podporze (${a.name}): F_E,A/f_yd ≤ A_s`, '9.2.1.4(2)', a.AsReq, a.AsProv, 'mm²'));
  if (RA.tor.on) add('T', 'Skręcanie + ścinanie: Asw/s jednej gałęzi (strefa s₁)', '6.3.2(3)', RA.tor.legReq1, RA.tor.legProv1, 'mm²/mm', { rel: '≥', fmt: 3 });
  RA.flanges.forEach(f => {
    add('fl1' + f.sec.key, `Ścinanie półka–środnik (${f.sec.loc}): v_Ed,A ≤ v_Rd,max`, '6.2.4(4)', f.vEd, f.vRdmax, 'MPa');
    add('fl2' + f.sec.key, `Ścinanie półka–środnik (${f.sec.loc}): A_sf/s_f`, '6.2.4(4)', f.AsfReq * 1000, f.AsfProv * 1000, 'mm²/m', { rel: '≥' });
  });
}

/* ----------------------------------------------------------- zestawienie stali */
function steelSchedule(R) {
  if (R.bare || !R.anch) return { rows: [], byD: {}, total: 0, Lb: R.md ? R.md.Ltot : 0, xL: 0, xR: R.md ? R.md.Ltot : 0, nSt: 0, lenSt: 0, vol: 0, laps: [], Lmax: Infinity, steps: [], short: [], bare: true };
  const S = R.S, g = R.g, md = R.md, rb = S.reb, h = g.h;
  // końce prętów podłużnych (czoło belki, lico uskoku – bez strzemion): otulina do powierzchni pręta ≥ max(c_nom (pręty główne); c_s + ⌀_w), c – do osi pręta
  const dswS = Math.max(...md.segs.map(sg => (sg.stir || S.stir).d)), dLmax = Math.max(12, ...md.segs.filter(sg => sg.Lb).flatMap(sg => sg.Lb.bars.map(b => b.dBar)), ...(R.LtM ? R.LtM.bars.map(b => b.dBar) : []));
  const cSurf = Math.max(R.cov.cnom_main || 0, R.cov.cs + dswS), c = Math.round(cSurf + dLmax / 2);
  const kgm = d => 0.00617 * d * d;
  const rows = [];
  const s0 = md.sups[0], sN = md.sups[md.sups.length - 1];
  const xL = s0 && s0.x < 1 ? -s0.t / 2 : 0;
  const xR = sN && sN.x > md.Ltot - 1 ? md.Ltot + sN.t / 2 : md.Ltot;
  const Lb = xR - xL;
  const multi = md.cont;
  // długość rozwinięta: wymiary zewnętrzne minus odliczenia na gięcie 90° (promień wewnętrzny r = φ_m/2)
  const dedOf = (r, d) => 2 * (r + d) - Math.PI * (r + d / 2) / 2;      // odliczenie na gięcie 90° (wymiary zewnętrzne → oś)
  const BE = S.barEdit || {};
  const addRow = o => { o.legL = o.legL || 0; o.legR = o.legR || 0;
    const ded = r => dedOf(r, o.d);
    o.len = o.len !== undefined ? o.len : Math.round((o.x1 - o.x0) + o.legL + o.legR - (o.legL ? ded(o.rL || 0) : 0) - (o.legR ? ded(o.rR || 0) : 0));
    if (o.n > 0 && o.len > 0) rows.push(Object.assign(o, { tot: o.n * o.len / 1000, mass: o.n * o.len / 1000 * kgm(o.d) })); };
  // grupowanie prętów układu: warstwa → (⌀, wiązka, doprowadzony/skrócony)
  const groupsOf = (lay, filt) => {
    const m = new Map();
    lay.bars.filter(filt || (() => true)).forEach(b => { const k = [b.layer, b.dBar, b.nb, b.supp === false ? 0 : 1].join('|'); const q = m.get(k) || { layer: b.layer, d: b.dBar, nb: b.nb, supp: b.supp !== false, n: 0, e: b.e }; q.n += b.nb; m.set(k, q); });
    return Array.from(m.values()).sort((p, q) => p.layer - q.layer || q.d - p.d);
  };
  const nLay = lay => new Set(lay.bars.map(b => b.layer)).size;
  // zakłady prętów dłuższych od handlowej długości L_max – w miejscach najmniejszych momentów rozciągających dany pręt
  const st = R.st, Lmax = S.anch.Lmax > 0 ? S.anch.Lmax * 1000 : Infinity;
  const tensFn = side => side === 'none' ? (() => 0) : (x => { const k = st.kAt(clamp(x, 0, md.Ltot)); return side === 'top' ? Math.max(0, -st.MEdMin[k]) : Math.max(0, st.MEdMax[k]); });
  const l0Of = (side, ds) => Math.max(0, ...ds.map(d => { const r = R.anch.rows.find(q => q.side === side && q.dBar === d) || R.anch.rows.find(q => q.side === side); return r ? r.l0 : 50 * d; }));
  const laps = [];
  // eL / eR – długość rozwinięta odgięć na końcach (wliczana do L_max: pręt = odcinek prosty + odgięcia)
  const lapPlan = (x0, x1, side, l0, info, eL, eR) => {
    eL = eL || 0; eR = eR || 0;
    if (!(x1 - x0 + eL + eR > Lmax + 1) || !(l0 > 0)) return [];
    const tf = tensFn(side), xsN = st.x.filter(x => x > x0 && x < x1), Mref = Math.max(1, ...xsN.map(tf));
    const cost = cc => { let mm = 0; for (let j = 0; j <= 8; j++) mm = Math.max(mm, tf(cc - l0 / 2 + l0 * j / 8)); return mm; };
    const out = []; let start = x0, guard = 0, eS = eL;
    while (x1 - start + eS + eR > Lmax + 1 && guard++ < 40) {
      const lo = start + l0 / 2 + 300, hi = Math.min(start + Lmax - eS - l0 / 2, x1 - l0 / 2 - 300);
      if (hi <= lo) break;
      const cand = []; for (let i = 0; i <= 80; i++) cand.push(lo + (hi - lo) * i / 80);
      xsN.forEach(x => { if (x >= lo && x <= hi) cand.push(x); });
      const cs = cand.map(cc => [cc, cost(cc)]), mn = Math.min(...cs.map(q => q[1]));
      const cc = Math.max(...cs.filter(q => q[1] <= mn + 0.02 * Mref).map(q => q[0]));
      const lp = Object.assign({ c: Math.round(cc), a: Math.round(cc - l0 / 2), b: Math.round(cc + l0 / 2), l0: Math.round(l0), M: cost(cc), side }, info || {});
      out.push(lp); laps.push(lp); start = lp.a; eS = 0;
    }
    return out;
  };
  // ręczna zmiana odcinka prostego: koniec przy krawędzi belki zostaje, drugi się przesuwa; pręt wewnątrz belki – symetrycznie
  const shorts = [];                                // pręty skrócone ręcznie poniżej długości wymaganej (zakotwienie / zasięg)
  const applyLen = (x0, x1, e) => {
    if (!e || !(e.len > 0)) return [x0, x1];
    const L = e.len, atL = x0 <= xL + c + 1, atR = x1 >= xR - c - 1;
    let a, b;
    if (atL && !atR) { a = x0; b = x0 + L; } else if (atR && !atL) { b = x1; a = x1 - L; } else { const m = (x0 + x1) / 2; a = m - L / 2; b = m + L / 2; }
    if (a < xL + c) { b += xL + c - a; a = xL + c; } if (b > xR - c) { a -= b - (xR - c); b = xR - c; }
    const r = [Math.max(xL + c, a), Math.min(xR - c, b)];
    if (r[1] - r[0] < x1 - x0 - 1) shorts.push({ e, need: x1 - x0, got: r[1] - r[0] });
    return r;
  };
  // odgięcie: automatyczne (zakotwienie) albo ręczne (e.legL / e.legR; 0 – pręt prosty)
  const legOf = (e, side, auto, rAuto, dirAuto, d) => {
    const man = e && e['leg' + side] !== '' && e['leg' + side] !== undefined;
    const leg = man ? +e['leg' + side] : auto, r = leg > 0 ? (man && !(auto > 0) ? mandrelMin(d) / 2 : rAuto || mandrelMin(d) / 2) : 0;
    return { leg, r, dir: (e && e['dir' + side]) || dirAuto, man, ext: leg > 0 ? leg - dedOf(r, d) : 0 };

  '6.2.1': { t: 'Ścinanie – zasady ogólne', s: 'Jeśli V<sub>Ed</sub> ≤ V<sub>Rd,c</sub>, zbrojenie na ścinanie nie jest wymagane obliczeniowo, ale w belkach stosuje się zbrojenie minimalne. Przy obciążeniu przeważnie równomiernym siłę do wymiarowania strzemion można przyjmować w odległości d od lica podpory; krzyżulce betonowe sprawdza się siłą przy podporze.', h: 'Opcja „V<sub>Ed</sub> w odległości d od lica” odpowiada tej zasadzie.' },
  '6.2.2': { t: 'Elementy bez zbrojenia na ścinanie', s: 'Nośność betonu na ścinanie zależy od wysokości użytecznej (k), stopnia zbrojenia podłużnego rozciąganego zakotwionego za przekrojem (ρ<sub>l</sub> ≤ 0,02) i naprężeń ściskających od siły osiowej, z dolnym ograniczeniem v<sub>min</sub>.', f: 'V<sub>Rd,c</sub> = [C<sub>Rd,c</sub>·k·(100ρ<sub>l</sub>f<sub>ck</sub>)<sup>1/3</sup> + k<sub>1</sub>σ<sub>cp</sub>]·b<sub>w</sub>d ≥ (v<sub>min</sub> + k<sub>1</sub>σ<sub>cp</sub>)·b<sub>w</sub>d', h: '' },
  '6.2.3': { t: 'Elementy ze zbrojeniem na ścinanie (model kratownicowy)', s: 'Nośność strzemion i nośność ściskanych krzyżulców betonowych zależą od kąta θ (1 ≤ cot θ ≤ 2,5). Większy cot θ zwiększa nośność strzemion, ale zmniejsza nośność krzyżulców i zwiększa przesunięcie obwiedni a<sub>l</sub>.', f: 'V<sub>Rd,s</sub> = A<sub>sw</sub>/s · z · f<sub>ywd</sub> · cot θ;  V<sub>Rd,max</sub> = α<sub>cw</sub>·b<sub>w</sub>·z·ν<sub>1</sub>·f<sub>cd</sub>/(cot θ + tan θ)', h: 'Brak nośności strzemion: zmniejsz rozstaw s₁, zwiększ średnicę lub liczbę ramion. Brak nośności krzyżulców: zwiększ b<sub>w</sub>, h lub klasę betonu (zmiana zbrojenia nie pomaga). W kierunku Z rolę b<sub>w</sub> pełni wysokość h, a nośność dają dwa poziome ramiona strzemion.' },
  '6.2.4': { t: 'Ścinanie między środnikiem a półką', s: 'Podłużne naprężenia styczne na styku półki ze środnikiem wynikają ze zmiany siły w półce na odcinku Δx. Gdy v<sub>Ed</sub> ≤ 0,4·f<sub>ctd</sub>, zbrojenie poprzeczne półki nie jest wymagane obliczeniowo; w innym razie dobiera się je z modelu kratownicowego i sprawdza krzyżulce w półce.', f: 'v<sub>Ed</sub> = ΔF<sub>d</sub>/(h<sub>f</sub>·Δx);  A<sub>sf</sub>/s<sub>f</sub> ≥ v<sub>Ed</sub>·h<sub>f</sub>/(f<sub>yd</sub>·cot θ<sub>f</sub>)', h: 'Zwiększ grubość półki albo zbrojenie poprzeczne półki.' },
  '6.3': { t: 'Skręcanie', s: 'Przekrój pełny zastępuje się cienkościennym zamkniętym o grubości ścianki t<sub>ef</sub>. Skręcanie wymaga dodatkowych zamkniętych strzemion i zbrojenia podłużnego rozłożonego na obwodzie; krzyżulce betonowe sprawdza się wspólnie dla ścinania i skręcania.', f: 'T<sub>Ed</sub>/T<sub>Rd,max</sub> + V<sub>Ed</sub>/V<sub>Rd,max</sub> ≤ 1;  ΣA<sub>sl</sub> = T<sub>Ed</sub>·u<sub>k</sub>·cot θ/(2A<sub>k</sub>f<sub>yd</sub>)', h: 'Strzemiona na skręcanie muszą być zamknięte i zakotwione zakładem lub hakami; rozstaw ≤ u/8.' },
  '7.2': { t: 'Ograniczenie naprężeń (SGU)', s: 'Naprężenia ściskające w betonie ogranicza się, aby nie powstawały rysy podłużne (k<sub>1</sub>·f<sub>ck</sub> przy kombinacji charakterystycznej – w klasach XD, XF, XS) i aby można było przyjąć liniowe pełzanie (k<sub>2</sub>·f<sub>ck</sub> przy kombinacji quasi-stałej). Naprężenia w stali przy kombinacji charakterystycznej nie powinny przekraczać k<sub>3</sub>·f<sub>yk</sub>.', f: 'σ<sub>c</sub> ≤ 0,6·f<sub>ck</sub>;  σ<sub>c,qp</sub> ≤ 0,45·f<sub>ck</sub>;  σ<sub>s</sub> ≤ 0,8·f<sub>yk</sub>', h: 'Duże σ<sub>s</sub> zmniejszysz, zwiększając zbrojenie rozciągane; duże σ<sub>c</sub> – zwiększając wysokość, klasę betonu lub dodając zbrojenie ściskane.' },
  '7.3.2': { t: 'Minimalne zbrojenie ze względu na zarysowanie', s: 'W strefach rozciąganych potrzebne jest zbrojenie zdolne przenieść siłę, przy której beton się zarysowuje; zależy od rozkładu naprężeń (k<sub>c</sub>), efektu wymiarów (k) i pola strefy rozciąganej A<sub>ct</sub>.', f: 'A<sub>s,min</sub>·σ<sub>s</sub> = k<sub>c</sub>·k·f<sub>ct,eff</sub>·A<sub>ct</sub>', h: '' },
  '7.3.3': { t: 'Zarysowanie bez bezpośrednich obliczeń; zbrojenie boczne wysokich belek', s: 'Rysy można kontrolować, ograniczając średnicę prętów (tab. 7.2N) lub ich rozstaw (tab. 7.3N) w zależności od naprężeń w stali. W belkach o wysokości ≥ 1 m, w których zbrojenie główne skupione jest na małej części wysokości, przy bocznych powierzchniach stosuje się dodatkowe zbrojenie (wewnątrz strzemion), rozłożone między zbrojeniem rozciąganym a osią obojętną; jego pole wyznacza się jak zbrojenie minimalne (7.3.2) z k = 0,5 i σ<sub>s</sub> = f<sub>yk</sub>.', f: 'A<sub>s,boczne</sub> ≥ k<sub>c</sub>·0,5·f<sub>ct,eff</sub>·A<sub>ct</sub>/f<sub>yk</sub>', h: 'Dodaj pręty boczne („w połowie wysokości”) w kilku rzędach przy każdym boku.' },
  '7.3.4': { t: 'Obliczanie szerokości rys', s: 'Szerokość rysy to iloczyn maksymalnego rozstawu rys i różnicy średnich odkształceń stali i betonu przy kombinacji quasi-stałej. Rozstaw rys zależy od otuliny, średnicy prętów i efektywnego stopnia zbrojenia ρ<sub>p,eff</sub>.', f: 'w<sub>k</sub> = s<sub>r,max</sub>·(ε<sub>sm</sub> − ε<sub>cm</sub>) ≤ w<sub>max</sub>', h: 'Zmniejsz średnicę prętów przy tym samym polu (więcej cieńszych prętów) albo zwiększ zbrojenie – obniży to σ<sub>s</sub>. Duża otulina zwiększa rozstaw rys.' },
  '7.4.1': { t: 'Ugięcia – wartości graniczne', s: 'Wygląd i użytkowalność są zwykle zachowane, gdy ugięcie od obciążeń quasi-stałych (z pełzaniem i skurczem) nie przekracza L/250; dla elementów, które mogą uszkodzić przylegające części konstrukcji – L/500 po ich wykonaniu.', f: 'f ≤ L/250', h: 'Dla wspornika w programie przyjęto L<sub>ref</sub> = 2·l. Zwiększ wysokość, zbrojenie rozciągane (zmniejsza krzywiznę po zarysowaniu) lub dodaj zbrojenie ściskane (ogranicza wpływ pełzania).' },
  '7.4.2': { t: 'Sprawdzanie ugięć bez obliczeń (L/d)', s: 'Ugięcia nie trzeba obliczać, gdy smukłość L/d nie przekracza wartości granicznej zależnej od stopnia zbrojenia, klasy betonu i schematu statycznego (K: 1,0 swobodnie podparta, 1,3 przęsło skrajne, 1,5 przęsło wewnętrzne, 0,4 wspornik).', f: 'L/d ≤ K·[11 + 1,5√f<sub>ck</sub>·ρ<sub>0</sub>/ρ + …]·(500/σ<sub>s</sub>)', h: 'Kryterium jest informacyjne – gdy nie jest spełnione, decyduje obliczenie dokładne (7.4.3).' },
  '7.4.3': { t: 'Obliczanie ugięć', s: 'Elementy zarysowane traktuje się jako pośrednie między stanem niezarysowanym i całkowicie zarysowanym (współczynnik ζ). Pełzanie uwzględnia się efektywnym modułem E<sub>c,eff</sub> = E<sub>cm</sub>/(1 + φ), skurcz – krzywizną 1/r<sub>cs</sub>. Ugięcie otrzymuje się przez całkowanie krzywizn.', f: 'α = ζ·α<sub>II</sub> + (1 − ζ)·α<sub>I</sub>;  ζ = 1 − β(M<sub>cr</sub>/M)²', h: 'W belce ciągłej obciążenie zmienne układa się na przęsłach naprzemiennych, aby otrzymać największe ugięcie każdego przęsła.' },
  '8.2': { t: 'Odstępy między prętami; zagęszczanie mieszanki', s: 'Prześwit między równoległymi prętami (lub wiązkami) w poziomie i pionie nie może być mniejszy od średnicy pręta (zastępczej wiązki), d<sub>g</sub> + 5 mm i 20 mm, aby beton mógł je dobrze otoczyć. Gdy pręty leżą w kilku warstwach, pręty kolejnych warstw układa się dokładnie nad prętami warstwy pierwszej, a między powstałymi „kolumnami” prętów zostawia się przestrzeń, przez którą można wprowadzić wibrator i dobrze zagęścić beton (8.2(4)).', f: 'a ≥ max{⌀; d<sub>g</sub> + 5 mm; 20 mm}', h: 'Program sprawdza dodatkowo, czy w zbrojeniu górnym oraz między kolumnami prętów (kilka warstw, pręty jeden nad drugim) zostaje prześwit ≥ średnica buławy + 10 mm – to założenie praktyczne, norma wymaga „wystarczającej przestrzeni”. Gdy go brak: zgrupuj pręty tak, by powstało „okno” na buławę, zastosuj mniej prętów o większej średnicy albo zwiększ szerokość.' },
  '8.4': { t: 'Zakotwienie prętów', s: 'Podstawowa długość zakotwienia wynika z przeniesienia siły w pręcie przez przyczepność f<sub>bd</sub> (zależną od warunków betonowania η<sub>1</sub> i średnicy η<sub>2</sub>). Długość obliczeniową redukują współczynniki α<sub>1</sub>…α<sub>5</sub> (kształt, otulina, zbrojenie poprzeczne, docisk), nie mniej niż l<sub>b,min</sub>.', f: 'l<sub>b,rqd</sub> = (⌀/4)·σ<sub>sd</sub>/f<sub>bd</sub>;  l<sub>bd</sub> = α<sub>1</sub>α<sub>2</sub>α<sub>3</sub>α<sub>4</sub>α<sub>5</sub>·l<sub>b,rqd</sub> ≥ l<sub>b,min</sub>', h: 'Przy braku miejsca zastosuj haki/pętle (α<sub>1</sub> = 0,7) lub pręty o mniejszej średnicy.' },
  '8.7': { t: 'Zakłady prętów', s: 'Długość zakładu to długość zakotwienia powiększona współczynnikiem α<sub>6</sub>, zależnym od udziału prętów łączonych w jednym przekroju. Zakłady należy rozmieszczać mijankowo, poza strefami największych naprężeń.', f: 'l<sub>0</sub> = α<sub>1</sub>α<sub>2</sub>α<sub>3</sub>α<sub>5</sub>α<sub>6</sub>·l<sub>b,rqd</sub> ≥ l<sub>0,min</sub>', h: '' },
  '8.9': { t: 'Wiązki prętów', s: 'Wiązkę prętów o jednakowej średnicy traktuje się jak pręt o średnicy zastępczej ⌀<sub>n</sub> = ⌀·√n<sub>b</sub> ≤ 55 mm (n<sub>b</sub> ≤ 3 w strefie rozciąganej). Średnicę zastępczą stosuje się do odstępów, otuliny i zakotwień, a prześwit mierzy od rzeczywistego obrysu wiązki. Dwa stykające się pręty ułożone jeden nad drugim w dobrych warunkach przyczepności nie muszą być traktowane jak wiązka (8.9.1(4)).', f: '⌀<sub>n</sub> = ⌀·√n<sub>b</sub> ≤ 55 mm', h: 'Pręty jeden nad drugim (bez odstępu) zwiększają pole zbrojenia w jednej warstwie, ale zmniejszają wysokość użyteczną d. Pamiętaj o prześwicie na buławę wibratora między kolumnami (8.2(4)). Gdy ⌀<sub>n</sub> > 32 mm, wymagane jest zbrojenie przypowierzchniowe (9.2.4).' },
  '9.2.1.1': { t: 'Minimalne i maksymalne zbrojenie podłużne', s: 'Pole zbrojenia rozciąganego nie powinno być mniejsze od wartości zapobiegającej kruchemu zniszczeniu po zarysowaniu, a całkowite zbrojenie (poza zakładami) nie większe niż 4% pola przekroju.', f: 'A<sub>s,min</sub> = max{0,26·f<sub>ctm</sub>/f<sub>yk</sub>·b<sub>t</sub>d; 0,0013·b<sub>t</sub>d};  A<sub>s,max</sub> = 0,04·A<sub>c</sub>', h: '' },
  '9.2.1.2': { t: 'Zbrojenie górne przy podporach skrajnych', s: 'Gdy belka jest monolitycznie połączona z podporą, przekrój przy podporze projektuje się na moment częściowego utwierdzenia – co najmniej 15% maksymalnego momentu przęsłowego.', f: 'A<sub>s,góra</sub> ≥ 0,15·A<sub>s,przęsło</sub> (w przybliżeniu)', h: 'Dla podpór czysto przegubowych (np. łożyska) warunek ma charakter konstrukcyjny.' },
  '9.2.1.3': { t: 'Obcinanie prętów – obwiednia sił rozciągających', s: 'Obwiednię momentów przesuwa się o a<sub>l</sub> = z·(cot θ − cot α)/2 w kierunku niekorzystnym; pręt obcięty kotwi się na długości l<sub>bd</sub> poza punktem, w którym przestaje być potrzebny.', f: 'a<sub>l</sub> = z·cot θ/2 (strzemiona pionowe)', h: 'Długości dodatkowych prętów górnych nad podporami i skróconych dolnych program wyznacza w ten sposób.' },
  '9.2.1.4': { t: 'Zbrojenie dolne przy podporach skrajnych', s: 'Do podpory należy doprowadzić co najmniej 25% zbrojenia przęsłowego. Zbrojenie to musi przenieść siłę F<sub>E</sub> wynikającą z przesunięcia obwiedni (plus ewentualną siłę rozciągającą) i być zakotwione za licem podpory.', f: 'F<sub>E</sub> = |V<sub>Ed</sub>|·a<sub>l</sub>/z + N<sub>Ed</sub>;  l<sub>bd</sub> ≤ t − c<sub>nom</sub>', h: 'Zbyt krótkie zakotwienie: haki/pętle, szersza podpora albo więcej cieńszych prętów (mniejsze σ<sub>sd</sub>).' },
  '9.2.1.5': { t: 'Zbrojenie dolne przy podporach pośrednich', s: 'Do podpory pośredniej doprowadza się co najmniej 25% zbrojenia przęsłowego i kotwi na długości co najmniej 10⌀ za licem (pręty proste) – zaleca się stosowanie prętów ciągłych lub zakładów, które przeniosą ewentualne momenty dodatnie przy podporze.', f: 'l ≥ 10⌀', h: '' },
  '9.2.2': { t: 'Zbrojenie na ścinanie – wymagania konstrukcyjne', s: 'Minimalny stopień zbrojenia strzemionami ρ<sub>w,min</sub>, maksymalny rozstaw podłużny s<sub>l,max</sub> = 0,75·d i poprzeczny ramion s<sub>t,max</sub> = 0,75·d ≤ 600 mm.', f: 'ρ<sub>w</sub> = A<sub>sw</sub>/(s·b<sub>w</sub>) ≥ 0,08√f<sub>ck</sub>/f<sub>yk</sub>', h: 'Strzemiona rozmieszcza się od lica podpory; w programie pierwsze strzemię leży 50 mm od lica, a strefa zagęszczona s₁ jest mierzona od lica.' },
  '9.2.3': { t: 'Zbrojenie na skręcanie – wymagania', s: 'Strzemiona na skręcanie powinny być zamknięte; ich rozstaw nie powinien przekraczać u/8, mniejszego wymiaru przekroju ani wymagań dla ścinania. Pręty podłużne rozmieszcza się na obwodzie, co najmniej po jednym w każdym narożu, w odstępach ≤ 350 mm.', h: '' },
  '9.2.4': { t: 'Zbrojenie przypowierzchniowe', s: 'Dodatkowe zbrojenie przy powierzchni może być potrzebne do ograniczenia rys i zabezpieczenia otuliny przed odpryskiwaniem – w szczególności przy prętach głównych lub wiązkach o średnicy powyżej 32 mm oraz przy otulinie większej niż 70 mm. Szczegóły podaje załącznik J.', h: 'Program sprawdza siatkę wg J.1: pole w obu kierunkach i oczko ≤ 150 mm; A<sub>ct,ext</sub> przyjęto jako pole betonu rozciąganego na zewnątrz strzemion (pas otuliny przy dolnej krawędzi i bokach strefy rozciąganej).' },
  'J': { t: 'Załącznik J.1 – zbrojenie przypowierzchniowe', s: 'Przy prętach (lub wiązkach) o średnicy większej niż 32 mm stosuje się siatkę z prętów lub małej średnicy o oczku nie większym niż 150 mm, umieszczoną na zewnątrz strzemion, o polu w każdym kierunku co najmniej 1% pola betonu rozciąganego poza strzemionami (A<sub>ct,ext</sub>). Przy otulinie większej niż 70 mm wymagane pole wynosi co najmniej 0,5% A<sub>ct,ext</sub>. Otulina siatki musi spełniać wymagania 4.4.1.', f: 'A<sub>s,surf</sub> ≥ 0,01·A<sub>ct,ext</sub> (⌀ > 32 mm) lub 0,005·A<sub>ct,ext</sub> (c > 70 mm); oczko ≤ 150 mm', h: 'Zastosuj siatkę z prętów ⌀6–⌀8 co 100–150 mm; pręty podłużne siatki można wliczyć do zbrojenia głównego, jeśli są właściwie zakotwione.' },
  'fire': { t: 'PN-EN 1992-1-2 – metoda tabelaryczna dla belek', s: 'Odporność ogniową R zapewnia się przez minimalną szerokość belki b<sub>min</sub> i minimalną odległość osi zbrojenia od powierzchni a (tablica 5.5 – belki swobodnie podparte, 5.6 – belki ciągłe). Przy jednej warstwie zbrojenia odległość osi prętów narożnych od boku zwiększa się o 10 mm (dla mniejszych szerokości). Dla belek teowych sprawdza się też grubość środnika.', f: 'b ≥ b<sub>min</sub>;  a ≥ a<sub>min</sub>', h: 'Zwiększ otulinę lub szerokość belki; dla zbrojenia w kilku warstwach decyduje średnia odległość osiowa a<sub>m</sub>.' },
  'acc': { t: 'Sytuacja wyjątkowa (PN-EN 1990, 6.11b)', s: 'Kombinacja wyjątkowa obejmuje obciążenia stałe, jedno oddziaływanie wyjątkowe A<sub>d</sub> i obciążenia zmienne z wartościami częstymi lub quasi-stałymi. Częściowe współczynniki materiałowe są mniejsze (γ<sub>c</sub> = 1,2, γ<sub>s</sub> = 1,0).', f: 'E<sub>d</sub> = G<sub>k</sub> + A<sub>d</sub> + ψ<sub>1,1</sub>(ψ<sub>2,1</sub>)·Q<sub>k,1</sub> + Σψ<sub>2,i</sub>·Q<sub>k,i</sub>', h: '' },
};

  XS3: 'części budowli morskich w strefie pływów, rozbryzgów i rozpylonej wody',

async function initCapabilities() {

  window.claude.use('downloads').then(dl => {
    Cap.dl = dl || null;
    $('#bExport').hidden = !Cap.dl;
    if (rendered.report) { rendered.report = false; if ($('.tabs button.on').dataset.tab === 'report') renderActive(); }
  }, () => { /* brak */ });
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    Cap.db = db; Cap.uid = uid; Cap.col = db.collection('data/users/' + uid);
    $('#bCloud').hidden = false;
    const tmo = setTimeout(() => { if (!Cap.ready) { Cap.slow = true; renderCloud(); } }, 10000);

async function cloudSave(asNew) {

<script>/* BelkaŻB – raport obliczeniowy (notka) */
(function () {
'use strict';
const BZR = window.BZR = {};

BZR.buildSimple = function (R, S) {
  const U = window.BZ, E = window.EC2;
  const { fmt, sym, esc } = U;

  const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
  let hn = 0; const H2 = t => `<h2>${++hn}. ${t}</h2>`;

  const worst = list => list.reduce((a, c) => (!a || (isFinite(c.ratio) ? c.ratio : 9) > (isFinite(a.ratio) ? a.ratio : 9) ? c : a), null);
  const sum = (title, list) => { const nF = list.filter(c => c.status === 'fail').length, nW = list.filter(c => c.status === 'warn').length, w = worst(list.filter(c => /^SG[NU]/.test(c.grp)));

  o += line(`Schemat: ${esc(sch.name)}${multi ? ` – ${md.segs.filter(q => q.kind === 'span').length} przęsła` : ''}; rozpiętości: ${md.segs.map(q => `${esc(q.label)} ${f(q.L / 1000, 2)} m`).join(', ')}`);

  o += line(`Stal ${esc(m.st.name)}: f<sub>yk</sub> = ${m.fyk} MPa, f<sub>yd</sub> = ${f(m.fyd, 1)} MPa; strzemiona f<sub>ywd</sub> = ${f(m.fywd, 1)} MPa`);
  o += line(`Otulina do strzemion: ${cov.faces ? `dół ${cov.cb}, góra ${cov.ct}, boki ${cov.cs} mm` : `c<sub>nom</sub> = ${cov.cnom} mm`} (klasa ekspozycji ${cov.exps.join(', ')})`);

  if (!st.manual) o += `<div class="fig">${U.schemeSVG(900)}</div>`;
  /* 3. wykresy */
  o += H2('Wykresy sił wewnętrznych, reakcje i ugięcia');

  const today = new Date();

  const sch = E.SCHEMES[S.scheme];

  void dstr;

  /* ---------------- 1. dane */
  o += H2('Dane wejściowe');
  const bunL = [...md.segs.filter(sg => sg.reb && sg.Lb).map(sg => sg.Lb), R.LtM, ...md.sups.filter(p => p.hasX && p.LtX).map(p => p.LtX)].find(l => l && l.bundle);
  const bunTxt = bunL ? `${bunL.bundle}; ⌀<sub>n</sub> = ⌀·√n<sub>b</sub> (8.9.1)` : 'brak – pręty pojedyncze';
  const LtxT = multi ? md.segs.map(sg => `${sg.label}: ${f(sg.L / 1000, 2)} m`).join('; ') : `${f(md.Ltot / 1000, 2)} m`;
  const geoTxt = gg => gg.T ? `teowy b<sub>w</sub>×h = ${gg.bw}×${gg.h} mm, b<sub>eff</sub> = ${f(gg.beff, 0)} mm, h<sub>f</sub> = ${gg.hf} mm` : `prostokątny b×h = ${gg.bw}×${gg.h} mm`;
  const KIND = { closed: 'zamknięte', pins: 'zamknięte + szpilki', open: 'otwarte (U)', tors: 'zamknięte na skręcanie (zakład)' };
  const stTxt = q => `⌀${q.d}, ${q.legs}-cięte, ${KIND[q.kind] || 'zamknięte'}, s₁ = ${q.s1} mm${q.sp ? `, s_p = ${q.sp} mm (strefa pośrednia)` : ''}, s₂ = ${q.s2} mm`;
  o += kv([
    ['Schemat statyczny', esc(sch.name) + (multi ? ` – ${md.nSpan} przęs${md.nSpan === 1 ? 'ło' : md.nSpan < 5 ? 'ła' : 'eł'}${S.cont.cantL > 0 ? ', wspornik lewy' : ''}${S.cont.cantR > 0 ? ', wspornik prawy' : ''}` : '')],
    [multi ? 'Rozpiętości' : 'Rozpiętość L<sub>eff</sub>', LtxT],
    ['Przekrój', R.gVar ? md.segs.map(sg => `${esc(sg.label)}: ${geoTxt(sg.g)}`).join('; ') : geoTxt(g)],
    ['Szerokość podpór t', new Set(md.sups.map(p => p.t)).size > 1 ? md.sups.map(p => `${p.label}: ${f(p.t, 0)}`).join(', ') + ' mm' : `${f(md.sups[0] ? md.sups[0].t : g.t, 0)} mm`],
    ['Beton', `${S.mat.concrete}`], ['Stal podłużna / strzemion', `${m.st.id} (kl. ${m.st.cls}) / ${m.sw.id}`],
    ['Klasa ekspozycji', `${cov.exps.join(', ')}`], ['Okres użytkowania', `${S.env.life} lat`],
    ['Otulina do strzemion c<sub>nom</sub>', cov.faces ? `dół ${cov.cb} mm, góra ${cov.ct} mm, boki ${cov.cs} mm` : `${cov.cnom} mm`],
    ['Zbrojenie górne ciągłe', R.LtM.n ? `${R.LtM.desc} (${f(R.LtM.A, 0)} mm²)` : '—'], ['Wiązki prętów', bunTxt],
    ['Pręty boczne', S.reb.mid.n > 0 ? `2×${S.reb.mid.n}⌀${S.reb.mid.d} (${S.reb.mid.n} rz. przy każdym boku)` : 'brak'], ['Buława wibratora', `⌀${S.reb.vib} mm (prześwit ≥ ${S.reb.vib + 10} mm)`],
    ['Strzemiona', R.stirVar ? md.segs.filter(sg => sg.kind === 'span' || !md.cont).map(sg => `${esc(sg.label)}: ${stTxt(sg.stir)}`).join('; ') + ' (od lica podpór)' : stTxt(md.segs[0].stir || S.stir) + ' (od lica podpór)'],
    ['Sytuacje obliczeniowe', st.hasAcc ? 'trwała/przejściowa + wyjątkowa' : 'trwała / przejściowa'],
  ]);
  o += `<h3>Podpory</h3>` + tbl(['Podpora', 'x [m]', 'rodzaj', 'blokady', 't [mm]', 'podatność'], md.sups.map(p => [`<b>${esc(p.label)}</b> – ${esc(p.name)}`, f(p.x / 1000, 2), esc(E.SUP_NAME[p.type]) + (p.hinge ? '; przegub w belce' : ''),
    [['x', p.fx], ['y', p.fy], ['z', p.fz], ['φ', p.type === 'fix']].filter(q => q[1]).map(q => q[0]).join(', ') || '—', f(p.t, 0),
    [p.kv > 0 ? `k<sub>v</sub> = ${f(p.kv, 0)} kN/m` : '', p.kr > 0 ? `k<sub>φ</sub> = ${f(p.kr, 0)} kNm/rad` : ''].filter(Boolean).join('; ') || (p.type === 'fix' ? 'sztywna (pełne utwierdzenie)' : 'niepodatna')]));
  if (md.unodes && md.unodes.length) o += `<p class="note">Węzły dodatkowe: ${md.unodes.map(q => `${q.hinge ? '<b>przegub</b>' : 'węzeł'} x = ${f(q.x / 1000, 2)} m (${esc(md.segs[q.seg].label)}, a = ${f(q.a / 1000, 2)} m)`).join('; ')}. Przegub – moment zginający równy zeru.</p>`;
  o += `<h3>Zbrojenie przekrojów obliczeniowych</h3>` + tbl(['Odcinek / podpora', 'rozciągane', 'ściskane', 'd [mm]'], R.secs.map(sec => [esc(cap(sec.loc)) + (sec.kind === 'span' ? ' (M > 0)' : ' (M < 0)'), `${sec.tens.desc} = ${f(sec.tens.A, 0)} mm²`, sec.comp && sec.comp.n ? `${sec.comp.desc} = ${f(sec.comp.A, 0)} mm²` : '—', f(sec.d, 0)]));
  if (!st.manual) {
    const refTxt = p => p.ref === 'R' ? `${f(num(p.a), 3)} m od prawej` : p.ref === 'rel' ? `x/L = ${f(num(p.a), 3)}` : '';
    const num = v => (v === '' || v === undefined ? NaN : +v);
    const segTxt = r => r.seg !== null && r.seg !== undefined && md.segs[r.seg] ? `${md.segs[r.seg].label}${r.el !== null && r.el !== undefined ? `, element ${r.el + 1}` : ''}, ` : '';
    const comp = r => [r.qy ? `q<sub>Y</sub> = ${f(r.qy, 2)} kN/m` : '', r.qz ? `q<sub>Z</sub> = ${f(r.qz, 2)} kN/m` : '', r.mt ? `m<sub>t</sub> = ${f(r.mt, 2)} kNm/m` : ''].filter(Boolean).map(t => `${t} (${segTxt(r)}${r.partial ? `x = ${f(r.x1 / 1000, 3)}÷${f(r.x2 / 1000, 3)} m` : 'cała długość'})`)
      .concat((r.pts || []).map(p => [p.Py ? `P<sub>Y</sub> = ${f(p.Py, 2)} kN` : '', p.Pz ? `P<sub>Z</sub> = ${f(p.Pz, 2)} kN` : '', p.T ? `T = ${f(p.T, 2)} kNm` : ''].filter(Boolean).join(', ') + ` w x = <b>${f(p.x / 1000, 3)} m</b>` + (p.a === '' ? ' (środek odcinka)' : refTxt(p) ? ` (${refTxt(p)})` : ''))).join('<br>');
    const lay = st.layout;
    const gSw = R.gVar ? md.segs.map(sg => f(sg.g.selfW, 2)).join(' / ') : (Array.isArray(st.gSelf) ? st.gSelf.map(v => f(v, 2)).join(' / ') : f(st.gSelf, 2));
    const rows = [
      ...(S.loads.gk ? [['G', 'Stałe g<sub>k</sub>', `${f(S.loads.gk, 2)} kN/m`, 'obciążenie dodatkowe, cała długość']] : []),
      ['G₀', 'Ciężar własny', `${gSw} kN/m`, S.loads.sw ? `25 kN/m³ · ${g.T ? 'b<sub>w</sub>·(h−h<sub>f</sub>)' : 'b·h'}${R.gVar ? ' (kolejne odcinki)' : ''}` : 'nie uwzględniono'],
      ...lay.G.filter(r => r.si !== undefined).map(r => ['G', esc(r.name), comp(r), 'obciążenie stałe']),
      ...st.vars.map(v => [v.id, esc(v.name), comp(v.r), `${esc(v.psi.name)}: ψ₀ = ${f(v.psi.p0, 1)}, ψ₁ = ${f(v.psi.p1, 1)}, ψ₂ = ${f(v.psi.p2, 1)}`]),
      ...st.accs.map(a => [a.id, esc(a.name), comp(a.r), 'oddziaływanie wyjątkowe – wartość obliczeniowa A<sub>d</sub>']),
      ...(st.NEd ? [['', 'Siła osiowa N<sub>Ed</sub>', `${f(st.NEd / 1e3, 1)} kN`, 'wartość obliczeniowa (+ ściskanie)']] : []),
      ...(st.TEd ? [['', 'Moment skręcający T<sub>Ed</sub>', `${f(st.TEd / 1e6, 1)} kNm`, 'wartość obliczeniowa']] : []),
      ...(st.hasAcc && (S.loads.accN || S.loads.accT) ? [['', 'N<sub>Ed,A</sub> / T<sub>Ed,A</sub>', `${f(S.loads.accN, 1)} kN / ${f(S.loads.accT, 1)} kNm`, 'sytuacja wyjątkowa']] : []),
    ];
    o += `<h3>Obciążenia (wartości charakterystyczne)</h3>` + rows.map(r => `<div class="eq">${r[0] ? `<b>${r[0]}</b> – ` : ''}${r[1]}: ${r[2]}${r[3] ? ` (${r[3]})` : ''}</div>`).join('');
  }

  /* ---------------- 2. materiały */
  o += H2('Parametry materiałowe') + `<h3>Beton ${S.mat.concrete}</h3>`;
  o += eq('f_{ck}', '', '', f(m.fck, 0), 'MPa', 'tab. 3.1') + eq('f_{cm}', 'f_{ck} + 8', '', f(m.fcm, 0), 'MPa');
  o += eq('f_{cd}', 'α_{cc}·f_{ck}/γ_{c}', `${f(m.acc, 2)}·${f(m.fck, 0)}/${f(m.gc, 2)}`, f(m.fcd, 2), 'MPa', '3.1.6(1)');
  o += eq('f_{ctm}', '', '', f(m.fctm, 2), 'MPa', 'tab. 3.1') + eq('f_{ctk,0,05}', '', '', f(m.fctk05, 2), 'MPa');
  o += eq('f_{ctd}', 'α_{ct}·f_{ctk,0,05}/γ_{c}', `${f(m.act, 2)}·${f(m.fctk05, 2)}/${f(m.gc, 2)}`, f(m.fctd, 3), 'MPa', '3.1.6(2)');
  o += eq('E_{cm}', '', '', f(m.Ecm / 1000, 0), 'GPa') + eq('ε_{cu3}', '', '', f(m.ecu3 * 1000, 2), '‰') + eq('λ', '', '', f(m.lambda, 3), '') + eq('η', '', '', f(m.eta, 3), '', '3.1.7(3)');
  o += `<h3>Stal ${esc(m.st.name)}</h3>`;
  o += eq('f_{yd}', 'f_{yk}/γ_{s}', `${m.fyk}/${f(m.gs, 2)}`, f(m.fyd, 2), 'MPa', '3.2.7') + eq('ε_{yd}', 'f_{yd}/E_{s}', `${f(m.fyd, 1)}/200000`, f(m.eyd * 1000, 3), '‰');
  o += eq('ε_{ud}', '0,9·ε_{uk}', `0,9·${f(m.euk * 100, 1)}%`, f(m.eud * 1000, 1), '‰', '3.2.7(2), ZK');
  o += eq('f_{ywd}', 'f_{ywk}/γ_{s}', `${m.fywk}/${f(m.gs, 2)}`, f(m.fywd, 2), 'MPa');
  o += eq('ξ_{eff,lim}', 'λ·ε_{cu3}/(ε_{cu3}+ε_{yd})', `${f(m.lambda, 2)}·${f(m.ecu3 * 1000, 2)}/(${f(m.ecu3 * 1000, 2)}+${f(m.eyd * 1000, 3)})`, f(m.xiEffLim, 3), '');

  /* ---------------- 3. otulina */
  if (has(['cnom', 'minclass'])) {
  o += H2('Otulina zbrojenia (4.4.1)');
  o += `<p>Klasa konstrukcji: ${cov.mods.map(esc).join('; ')} → <b>S${cov.sc}</b> (tab. 4.3N).</p>`;
  o += eq('c_{min,dur}', '', `tab. 4.4N, ${cov.exp}, S${cov.sc}`, cov.cdur, 'mm', '4.4.1.2(5)');
  o += eq('c_{min,b}', '⌀ (strzemiona / pręty główne)', `${cov.dSw} / ${cov.dMain}` + (cov.add ? ' + 5 (d_{g} > 32 mm)' : ''), `${cov.cminb_sw} / ${cov.cminb_main}`, 'mm', 'tab. 4.2');
  o += eq('c_{min}', 'max\\{c_{min,b}; c_{min,dur}+Δc_{dur,γ}−Δc_{dur,st}−Δc_{dur,add}; 10 mm\\}'.replace(/\\/g, ''), '', `${cov.cmin_sw} / ${cov.cmin_main}`, 'mm (strzemiona / pręty główne)', '4.4.1.2(2)');
  o += eq('c_{nom}', 'c_{min} + Δc_{dev}', `${cov.cmin_sw} + ${cov.dcdev} / ${cov.cmin_main} + ${cov.dcdev}`, `${cov.cnom_sw} / ${cov.cnom_main}`, 'mm', '4.4.1.1(2)');
  o += line(`Wymagana otulina strzemion: c<sub>nom,w</sub> ≥ max{${cov.cnom_sw}; ${cov.cnom_main} − ${cov.dSw}${cov.ground ? `; ${cov.ground} (betonowanie na podłożu)` : ''}} = <b>${f(cov.req, 0)} mm</b> → ${cov.manual ? `wymagane ${cov.reqR} mm; przyjęto ręcznie` : 'przyjęto'} <b>c<sub>nom</sub> = ${cov.cnom} mm</b> ` +
    `<span class="${cov.cnom >= cov.reqR ? 'ok' : 'fail'}">${cov.cnom >= cov.reqR ? '✔' : '✖ za mała otulina'}</span>`);
  if (cov.faces) o += line(`Otulina poszczególnych krawędzi (do strzemion): dół c<sub>nom,b</sub> = <b>${cov.cb} mm</b> (wymagane ${cov.reqB} mm) <span class="${cov.cb >= cov.reqB ? 'ok' : 'fail'}">${cov.cb >= cov.reqB ? '✔' : '✖'}</span>; góra c<sub>nom,t</sub> = <b>${cov.ct} mm</b> (wymagane ${cov.reqT} mm) <span class="${cov.ct >= cov.reqT ? 'ok' : 'fail'}">${cov.ct >= cov.reqT ? '✔' : '✖'}</span>; boki c<sub>nom,s</sub> = <b>${cov.cs} mm</b> (wymagane ${cov.reqS} mm) <span class="${cov.cs >= cov.reqS ? 'ok' : 'fail'}">${cov.cs >= cov.reqS ? '✔' : '✖'}</span>`, '4.4.1');
  o += line(`Minimalna klasa betonu ze względu na trwałość (zał. E, tab. E.1N): ${cov.minCls} (${cov.minFrom}) – przyjęto ${S.mat.concrete} <span class="${cov.minOk ? 'ok' : 'warn'}">${cov.minOk ? '✔' : '⚠ klasa niższa od zalecanej'}</span>`);
  }

  /* ---------------- 4. statyka */
  o += H2('Obciążenia i siły wewnętrzne');
  if (!st.manual) {
    o += `<h3>Schemat obciążeń</h3><p class="note">Położenia x mierzone od lewego końca belki${S.scheme === 'cant' ? ' (utwierdzenia)' : multi ? '' : ' (oś lewej podpory)'}; wartości charakterystyczne, A – obliczeniowe; [Z] – obciążenia w płaszczyźnie prostopadłej do układu (poziome).</p><div class="fig">${U.schemeSVG(900)}</div>`;
    if (S.loads.gk) o += eq('g_{k}', 'g_{k,dod} + g_{k,cw}', `${f(S.loads.gk, 2)} + ${gSwTxt()}`, Array.isArray(st.gk) ? st.gk.map(v => f(v, 2)).join(' / ') : f(st.gk, 2), 'kN/m');
    o += `<p>Każde obciążenie zmienne traktowano jako niezależne oddziaływanie. Rozpatrzono wszystkie kombinacje z kolejnymi obciążeniami jako wiodącymi; obciążenia zmienne uwzględniano tylko w miejscach, gdzie działają niekorzystnie, a obciążenia stałe z γ<sub>G,sup</sub> = ${f(S.loads.gG, 2)} (niekorzystnie) lub γ<sub>G,inf</sub> = 1,0 (korzystnie)` +
      (st.combos && st.vars.some(v => v.it.kind === 'imp' && v.it.cat === 'H') && st.vars.some(v => v.it.kind === 'snow' || v.it.kind === 'wind') ? '. Obciążenia dachu kat. H nie łączono ze śniegiem i wiatrem (PN-EN 1991-1-1, 3.3.2(1))' : '') + `.</p>`;
    if (S.loads.comb === '610') o += line(`E<sub>d</sub> = Σγ<sub>G,j</sub>·G<sub>k,j</sub> + γ<sub>Q,1</sub>·Q<sub>k,1</sub> + Σγ<sub>Q,i</sub>·ψ<sub>0,i</sub>·Q<sub>k,i</sub>`, 'PN-EN 1990 (6.10)');
    else o += line(`E<sub>d</sub> = max{ Σγ<sub>G,j</sub>·G<sub>k,j</sub> + Σγ<sub>Q,i</sub>·ψ<sub>0,i</sub>·Q<sub>k,i</sub> ; Σξ·γ<sub>G,j</sub>·G<sub>k,j</sub> + γ<sub>Q,1</sub>·Q<sub>k,1</sub> + Σγ<sub>Q,i</sub>·ψ<sub>0,i</sub>·Q<sub>k,i</sub> }, ξ = ${f(S.loads.xi, 2)}`, '(6.10a), (6.10b)');
    o += line(`Charakterystyczna: G<sub>k</sub> + Q<sub>k,1</sub> + Σψ<sub>0,i</sub>·Q<sub>k,i</sub>; quasi-stała: G<sub>k</sub> + Σψ<sub>2,i</sub>·Q<sub>k,i</sub> = ${esc(comboDescQP())}`, '(6.14b), (6.16b)');
    if (st.hasAcc) o += line(`Wyjątkowa: G<sub>k</sub> + A<sub>d</sub> + ${S.loads.accPsi === 'psi2' ? 'ψ<sub>2,1</sub>' : 'ψ<sub>1,1</sub>'}·Q<sub>k,1</sub> + Σψ<sub>2,i</sub>·Q<sub>k,i</sub> (każde A<sub>d</sub> osobno)`, '(6.11b)');
    const cmbLines = (title, rows, sx) => rows && rows.length ? `<p><i>${title}:</i></p>` + rows.map(r => line(`${esc(r.name)}: ${esc(r.desc)} → M<sub>${sx}</sub> max = ${r.govMpos ? '<b>' : ''}${f(r.Mpos / 1e6, 2)}${r.govMpos ? '</b>' : ''} kNm${st.hasNeg ? `, M<sub>${sx}</sub> min = ${r.govMneg ? '<b>' : ''}${f(r.Mneg / 1e6, 2)}${r.govMneg ? '</b>' : ''} kNm` : ''}, |V<sub>${sx}</sub>| max = ${r.govVmax ? '<b>' : ''}${f(r.Vmax / 1e3, 1)}${r.govVmax ? '</b>' : ''} kN${st.hasZ ? `, |M<sub>z,${sx}</sub>| = ${f(r.Mz / 1e6, 2)} kNm` : ''}`)).join('') : '';
    o += cmbLines('Kombinacje SGN – sytuacja trwała/przejściowa (6.10)', st.tabU, 'Ed') + (st.tabA ? cmbLines('Kombinacje SGN – sytuacja wyjątkowa (6.11b)', st.tabA, 'Ed,A') : '') + cmbLines('Kombinacje SGU – charakterystyczne (6.14b)', st.tabK, 'Ek');
    o += `<p class="note">Oznaczenia: G – obciążenia stałe; ${st.vars.map(v => `${v.id} – ${esc(v.name)}`).join('; ')}. Pogrubiono wartości decydujące.</p>`;
    o += `<p class="note">Siły wewnętrzne wyznaczono metodą elementów skończonych dla całej belki (${st.mesh.length - 1} elementów belkowych, węzły w podporach, w punktach przyłożenia sił skupionych i na granicach obciążeń) osobno dla każdego obciążenia${multi ? ', a obciążenia zmienne – osobno dla każdego przęsła (wspornika), co pozwala uwzględnić najniekorzystniejszy układ obciążenia na przęsłach' : ''}; analiza liniowo-sprężysta, bez redystrybucji. Obwiednie z kombinacji punkt po punkcie${st.hasZ ? '; obciążenia w płaszczyźnie Z analizowano tym samym modelem (zginanie względem osi pionowej)' : ''}.</p>`;
  } else o += `<p>Siły wewnętrzne wprowadzone ręcznie; rozkład M(x) – parabola przez wartości w punktach x = 0, L/2, L; V(x) – liniowy.</p>`;
  o += `<h3>Momenty i siły poprzeczne w przekrojach obliczeniowych</h3>`;
  R.secs.forEach(sec => { const r = sec.sls; o += line(`${esc(cap(sec.loc))} (${sec.kind === 'span' ? 'M > 0' : 'M < 0'}), x = ${f(sec.x / 1000, 2)} m: |M<sub>Ed</sub>| = <b>${f(sec.MEd / 1e6, 1)} kNm</b>, M<sub>Ek</sub> = ${r ? f(r.Mk / 1e6, 1) : '—'} kNm, M<sub>Eqp</sub> = ${r ? f(r.Mqp / 1e6, 1) : '—'} kNm${st.hasZ ? `, |M<sub>z,Ed</sub>| = ${f(st.MzEd[sec.k] / 1e6, 1)} kNm` : ''}`); });
  R.sh.ends.forEach(e => { o += line(`${esc(cap(e.name))}: V<sub>Ed</sub> w osi = <b>${f(e.V0 / 1e3, 1)} kN</b>; do wymiarowania strzemion ${e.red ? `V<sub>Ed,red</sub> = <b>${f(e.Vred / 1e3, 1)} kN</b> (w odległości d od lica, ${f(e.xr / 1000, 3)} m od osi)` : `V<sub>Ed</sub> = <b>${f(e.Vred / 1e3, 1)} kN</b> – bez redukcji${e.redWhy ? ` (${esc(e.redWhy)})` : ''}`}${st.hasZ && e.zsh ? `; V<sub>z,Ed</sub> = ${f(e.zsh.V0 / 1e3, 1)} kN` : ''}`); });
  if (st.reac && !st.manual) {
    o += `<h3>Reakcje podporowe</h3>`;
    o += BZR.reacDesc(R);
  }
  if (st.TEd > 0) o += line(`Moment skręcający: T<sub>Ed,max</sub> = <b>${f(st.TEd / 1e6, 2)} kNm</b>${st.TEdAdd ? ` (w tym podany wprost ${f(st.TEdAdd / 1e6, 2)} kNm)` : ''}${st.hasT ? ' – z analizy pręta skręcanego (podparcie widełkowe w podporach)' : ''}`);
  if (st.NEd) o += line(`Siła osiowa: N<sub>Ed</sub> = <b>${f(st.NEd / 1e3, 1)} kN</b> (${st.NEd > 0 ? 'ściskanie' : 'rozciąganie'}), stała na długości belki`);
  try {
    const cd = U.chartsData();

  } catch (e) { /* */ }

  /* ---------------- 5. zginanie */
  const show5 = has(['Mspan', 'Msupp', 'duct', 'biax', 'biaxZ', 'N']);
  if (show5) o += H2('SGN – zginanie z siłą osiową');
  const n5 = hn;
  const bendSec = (b, nm) => {
    const isSpan = b.kind === 'span';
    let s = `<h3>${nm}</h3>`;
