    s += `<p><i>a) Wymiarowanie – metoda uproszczona (prostokątny rozkład naprężeń, λ = ${f(m.lambda, 2)}, η = ${f(m.eta, 2)}):</i></p>`;
    if (st.NEd) s += eq('M_{Eds}', 'M_{Ed} + N_{Ed}·(d − y_{c})', `${f(b.MEd / 1e6, 2)} + ${f(st.NEd / 1e3, 1)}·(${f(b.d, 1)} − ${f(b.yc, 1)})·10^{−3}`, f(ds.Ms / 1e6, 2), 'kNm');
    if (ds.Mf !== undefined) s += eq('M_{f}', 'η·f_{cd}·b_{eff}·h_{f}·(d − 0,5·h_{f})', `${f(m.eta, 2)}·${f(m.fcd, 2)}·${f(g.beff, 0)}·${g.hf}·(${f(b.d, 1)} − ${f(g.hf / 2, 1)})`, f(ds.Mf / 1e6, 1), 'kNm') +
      line(ds.T ? `M<sub>Eds</sub> > M<sub>f</sub> → oś obojętna w środniku (przekrój rzeczywiście teowy): F<sub>f</sub> = η·f<sub>cd</sub>·(b<sub>eff</sub> − b<sub>w</sub>)·h<sub>f</sub> = <b>${f(ds.Ff / 1e3, 1)} kN</b>` : `M<sub>Eds</sub> ≤ M<sub>f</sub> → oś obojętna w półce – przekrój pozornie teowy, b = b<sub>eff</sub>`);
    s += eq('μ_{eff}', (ds.T ? '(M_{Eds} − F_{f}·(d − h_{f}/2))' : 'M_{Eds}') + '/(η·f_{cd}·b·d^{2})', `${f(ds.Mw / 1e6, 2)}·10^{6}/(${f(m.eta, 2)}·${f(m.fcd, 2)}·${f(ds.b, 0)}·${f(b.d, 1)}^{2})`, f(ds.mu, 4), '', '');
    s += eq('μ_{eff,lim}', 'ξ_{eff,lim}·(1 − 0,5·ξ_{eff,lim})', '', f(ds.muLim, 4), '');
    if (!ds.double) {
      s += eq('ξ_{eff}', '1 − √(1 − 2·μ_{eff})', '', f(ds.xi, 4), '') + line(`ξ<sub>eff</sub> = ${f(ds.xi, 3)} ≤ ξ<sub>eff,lim</sub> = ${f(m.xiEffLim, 3)} → zbrojenie pojedyncze`);
      s += eq('A_{s1,req}', '(ξ_{eff}·b·d·η·f_{cd}' + (ds.T ? ' + F_{f}' : '') + (st.NEd ? ' − N_{Ed}' : '') + ')/f_{yd}', '', f(ds.As1, 0), 'mm²', '');
    } else {
      s += line(`μ<sub>eff</sub> > μ<sub>eff,lim</sub> → wymagane zbrojenie ściskane (podwójne).`);
      s += eq('M_{lim}', 'μ_{eff,lim}·η·f_{cd}·b·d^{2}', '', f(ds.Mlim / 1e6, 2), 'kNm') + eq('σ_{s2}', 'min(f_{yd}; E_{s}·ε_{cu3}·(x_{lim} − a_{2})/x_{lim})', '', f(ds.ss2, 1), 'MPa');
      s += eq('A_{s2,req}', '(M_{Eds} − M_{lim})/(σ_{s2}·(d − a_{2}))', '', f(ds.As2, 0), 'mm²') + eq('A_{s1,req}', '(ξ_{eff,lim}·b·d·η·f_{cd} + A_{s2}·σ_{s2}' + (st.NEd ? ' − N_{Ed}' : '') + ')/f_{yd}', '', f(ds.As1, 0), 'mm²');
    }
    s += line(`Przyjęto: A<sub>s1,prov</sub> = ${tens.desc} = <b>${f(tens.A, 0)} mm²</b> ${tens.A >= ds.As1 ? '≥' : '<'} A<sub>s1,req</sub> = ${f(ds.As1, 0)} mm² <span class="${tens.A >= ds.As1 ? 'ok' : 'fail'}">${tens.A >= ds.As1 ? '✔' : '✖'}</span>` + (ds.As2 > 0 ? `; A<sub>s2,prov</sub> = ${f(comp ? comp.A : 0, 0)} mm² ${(comp ? comp.A : 0) >= ds.As2 ? '≥' : '<'} ${f(ds.As2, 0)} mm²` : ''));
    s += `<p><i>b) Sprawdzenie nośności – metoda ogólna (zgodność odkształceń, przekrój z rzeczywistym zbrojeniem rozciąganym i ściskanym):</i></p>`;
    if (b.r) {
      const bs = b.r;

      const comps = bs.bs.map((q, i) => ({ q, b: b.barsO[i] })).filter(o2 => o2.b.side === (isSpan ? 'top' : 'bot'));
      if (comps.length) s += line(`Zbrojenie ściskane: ε<sub>s2</sub> = ${f(comps[0].q.e * 1000, 3)}‰, σ<sub>s2</sub> = ${f(comps[0].q.s, 1)} MPa`);
      s += eq('M_{Rd}', '', '∫σ_{c}·b·(y_{c} − y)dy + ΣA_{si}·σ_{si}·(y_{c} − y_{i})', f(b.MRd / 1e6, 2), 'kNm', '6.1');

  }

  /* ---------------- 6. ścinanie */
  const sh = R.sh, tor = R.tor;

  if (show6) {
  o += H2(`SGN – ścinanie${tor.on ? ' i skręcanie' : ''} (6.2${tor.on ? ', 6.3' : ''})`);

  o += line(`Kąt nachylenia krzyżulców betonowych: ${S.stir.cot === 'auto' ? 'dobrany automatycznie (największy dopuszczalny z przedziału 1,0 ≤ cot θ ≤ 2,5)' : 'przyjęty'}: <b>cot θ = ${f(sh.cot, 2)}</b> (θ = ${f(sh.theta, 1)}°)`, '6.2.3(2)');
  const zs = R.stirZones || [];
  if (zs.length) o += line(`Rozmieszczenie strzemion od lica podpór: ${zs.map(z => `${multi ? esc(z.seg.label) + ': ' : ''}${z.eL !== null ? `e = ${f(z.eL, 0)} mm, ` : ''}${z.n} szt.${z.nL || z.nR ? `, strefy s₁: ${z.nL}+${z.nR} odstępów po ${(z.seg.stir || S.stir).s1} mm` : ''}${z.npL || z.npR ? `, strefy pośrednie s_p: ${z.npL}+${z.npR} odstępów po ${z.sp} mm` : ''}, część środkowa ${z.nm} × ${f(z.sm, Math.abs(z.sm - Math.round(z.sm)) < 1e-6 ? 0 : 1)} mm`).join('; ')} (odstęp pierwszego strzemienia ${S.stir.e0 === '' ? 'dobrany z przedziału 10–50 mm dla równomiernego rozstawu' : 'przyjęty ręcznie'})`, '9.2.2');
  sh.ends.forEach(sp => {
    if (!has(['Vmax', 'Vs1', 'l1', 'VzMax', 'VzS', 'VzI'], sp.key)) return;
    o += `<h3>${esc(cap(sp.name))}${sp.hog ? ' (moment ujemny – ρ<sub>l</sub> ze zbrojenia górnego)' : ''}</h3>`;
    const qs = sp.stir || S.stir, bwS = sp.bw || g.bw, AswS = Math.max(2, qs.legs) * Math.PI * qs.d * qs.d / 4;
    o += eq('V_{Ed}', '', `w osi podpory`, f(sp.V0 / 1e3, 1), 'kN');
    o += sp.red ? eq('V_{Ed,red}', '', `w odległości t/2 + d = ${f(sp.xr, 0)} mm od osi (obciążenie na górnej powierzchni, reakcja na dolnej – podparcie bezpośrednie)`, f(sp.Vred / 1e3, 1), 'kN', '6.2.1(8)')
      : line(`Bez redukcji siły poprzecznej przy podporze${sp.redWhy ? ` – ${esc(sp.redWhy)}` : ''}: do wymiarowania V<sub>Ed</sub> = ${f(sp.Vred / 1e3, 1)} kN`, '6.2.1(8)');
    o += eq('k', '1 + √(200/d) ≤ 2,0', `1 + √(200/${f(sp.d, 0)})`, f(sp.k, 3), '') + eq('ρ_{l}', 'A_{sl}/(b_{w}·d) ≤ 0,02', `${f(sp.Asl, 0)}/(${bwS}·${f(sp.d, 0)})`, f(sp.rhol, 5), '');
    if (sp.sigcp) o += eq('σ_{cp}', 'N_{Ed}/A_{c} < 0,2·f_{cd}', '', f(sp.sigcp, 3), 'MPa');
    o += eq('V_{Rd,c}', '[C_{Rd,c}·k·(100·ρ_{l}·f_{ck})^{1/3} + k_{1}·σ_{cp}]·b_{w}·d', `[${f(sp.CRdc, 4)}·${f(sp.k, 3)}·(100·${f(sp.rhol, 5)}·${m.fck})^{1/3}${sp.sigcp ? ` + 0,15·${f(sp.sigcp, 2)}` : ''}]·${bwS}·${f(sp.d, 0)}`, f(sp.VRdc1 / 1e3, 1), 'kN', '(6.2a)');
    o += eq('V_{Rd,c,min}', '(v_{min} + k_{1}·σ_{cp})·b_{w}·d', `(${f(sp.vmin, 4)}${sp.sigcp ? ` + 0,15·${f(sp.sigcp, 2)}` : ''})·${bwS}·${f(sp.d, 0)}`, f(sp.VRdcMin / 1e3, 1), 'kN', '(6.2b)');
    o += line(sp.Vred <= sp.VRdc ? `V<sub>Ed</sub> = ${f(sp.Vred / 1e3, 1)} kN ≤ V<sub>Rd,c</sub> = ${f(sp.VRdc / 1e3, 1)} kN → wystarczy zbrojenie minimalne (w belkach zawsze stosuje się strzemiona, 9.2.2(5))` : `V<sub>Ed</sub> = ${f(sp.Vred / 1e3, 1)} kN > V<sub>Rd,c</sub> = ${f(sp.VRdc / 1e3, 1)} kN → wymagane obliczeniowe zbrojenie na ścinanie`);
    o += eq('z', '0,9·d', `0,9·${f(sp.d, 1)}`, f(sp.z, 1), 'mm') + eq('ν_{1}', '0,6·(1 − f_{ck}/250)', `0,6·(1 − ${m.fck}/250)`, f(m.nu, 3), '', '(6.6N)');

    o += tor.on ? line(`Interakcja: V<sub>Ed</sub>/V<sub>Rd,max</sub> + T<sub>Ed</sub>/T<sub>Rd,max</sub> = ${f(sp.V0 / sp.VRdmax, 3)} + ${f(st.TEd / tor.TRdmax, 3)} = <b>${f(sp.inter, 3)}</b> ≤ 1,0 <span class="${sp.inter <= 1 ? 'ok' : 'fail'}">${sp.inter <= 1 ? '✔' : '✖'}</span>`, '(6.29)') : cmp(sp.V0 / 1e3, '≤', sp.VRdmax / 1e3, 'kN', 1);

      o += eq('V_{Rd,max,z}', 'h·z_{z}·ν_{1}·f_{cd}/(cotθ + tanθ)', `${f(z.bw, 0)}·${f(z.zz, 1)}·${f(m.nu, 3)}·${f(m.fcd, 2)}/(${f(sh.cot, 2)} + ${f(1 / sh.cot, 3)})`, f(z.VRdmax / 1e3, 1), 'kN', '(6.9)') + cmp(z.V0 / 1e3, '≤', z.VRdmax / 1e3, 'kN', 1);

      o += line(`Krzyżulce – interakcja kierunków: V<sub>Ed,y</sub>/V<sub>Rd,max,y</sub> + V<sub>Ed,z</sub>/V<sub>Rd,max,z</sub>${tor.on ? ' + T<sub>Ed</sub>/T<sub>Rd,max</sub>' : ''} = <b>${f(z.inter, 3)}</b> ≤ 1,0 <span class="${z.inter <= 1 ? 'ok' : 'fail'}">${z.inter <= 1 ? '✔' : '✖'}</span>`);

  if (has(['rho1', 'rho2', 'smax', 'st'])) o += `<h3>Wymagania konstrukcyjne dla strzemion (9.2.2)</h3>`;

  (sh.segs || []).forEach((z, zi) => {

    o += eq('ΣA_{sl}', 'T_{Ed}·u_{k}·cotθ/(2·A_{k}·f_{yd})', '', f(tor.AslReq, 0), 'mm²', '(6.28)') + line(`Rozdział: na krawędź górną i dolną po ${f(tor.AslTB, 0)} mm², na każdy bok ${f(tor.AslSide, 0)} mm²; rozstaw strzemion ≤ u/8 = ${f(tor.u / 8, 0)} mm (9.2.3(3)).`);
    if (has(['Tside'])) o += cmp(tor.AslSide, '≤', S.reb.mid.n * Math.PI * S.reb.mid.d * S.reb.mid.d / 4, `mm² (pręty boczne przy każdym boku: ${S.reb.mid.n ? S.reb.mid.n + '⌀' + S.reb.mid.d : 'brak'})`, 0);
  }
  R.flanges.forEach(fl => {

  /* ---------------- sytuacja wyjątkowa */

  /* ---------------- wymagania konstrukcyjne */
  const ids8 = ['asmin', 'asmax', 'sp', 'vib', 'phin', 'midsp', 'lat', 'skin', 'surf0', 'surf', 'surft', 'surfs'];
  if (has(ids8)) {
  o += H2('Wymagania konstrukcyjne');
  R.secs.forEach(sec => {
    const rs = sec.sls; if (!rs || !has(['asmin'], sec.key)) return;
    o += eq('A_{s,min}', 'max(0,26·f_{ctm}/f_{yk}·b_{t}·d; 0,0013·b_{t}·d)', `${esc(sec.loc)}: max(0,26·${f(m.fctm, 2)}/${m.fyk}·${f(rs.bt, 0)}·${f(rs.d, 0)}; 0,0013·${f(rs.bt, 0)}·${f(rs.d, 0)})`, f(rs.AsMin, 0), 'mm²', '(9.1N)') + cmp(rs.AsMin, '≤', sec.tens.A, 'mm²', 0);
  });
  if (has(['asmax'])) { const c = R.checks.find(q => q.id === 'asmax'); o += eq('A_{s,max}', '0,04·A_{c}', `0,04·${f(g.Ac, 0)}`, f(0.04 * g.Ac, 0), 'mm²', '9.2.1.1(3)') + cmp(c.Ed, '≤', c.Rd, 'mm² (całkowite zbrojenie podłużne)', 0); }
  const lays = [];

  lays.forEach(([n, lay, key]) => {

    if (has(['vib'], key)) o += line(`Prześwit na buławę wibratora ⌀${S.reb.vib} mm – pręty ${esc(n)}: największy prześwit ${f(lay.open, 0)} mm ${lay.open >= S.reb.vib + 10 ? '≥' : '<'} ${S.reb.vib} + 10 = ${S.reb.vib + 10} mm <span class="${lay.open >= S.reb.vib + 10 ? 'ok' : 'warn'}">${lay.open >= S.reb.vib + 10 ? '✔' : '⚠ utrudnione zagęszczanie'}</span>`, '8.2(4)');
  });
  if (has(['phin'])) { const c = R.checks.find(q => q.id === 'phin'); o += line(`Wiązki prętów: ⌀<sub>n</sub> = ⌀·√n<sub>b</sub> = ${f(c.Ed, 1)} mm ≤ 55 mm <span class="ok">✔</span>; ${esc(c.note)}`, '8.9.1'); }
  if (has(['midsp'])) { const c = R.checks.find(q => q.id === 'midsp'); o += line(`${sym(c.name)}: ${f(c.Rd, 0)} mm ${c.Rd >= c.Ed ? '≥' : '<'} s<sub>min</sub> = ${f(c.Ed, 0)} mm <span class="${c.status}">${c.status === 'ok' ? '✔' : '✖'}</span>`, '8.2(2)'); }
  if (has(['skin'])) { const c = R.checks.find(q => q.id === 'skin'); o += eq('A_{s,boczne}', 'k_{c}·k·f_{ct,eff}·A_{ct}/f_{yk}', `0,4·0,5·${f(m.fctm, 2)}·A_{ct}/${m.fyk}`, f(c.Ed, 0), 'mm²', '7.3.3(3)') + cmp(c.Ed, '≤', c.Rd, 'mm² (pręty boczne w strefie rozciąganej)', 0); }
  const lat = R.checks.find(c => c.id === 'lat');
  if (lat && has(['lat'])) o += line(`Zwichrzenie: l<sub>0t</sub>/b = ${f(lat.Ed, 1)} ≤ 50/(h/b)<sup>1/3</sup> = ${f(lat.Rd, 1)}; ${esc(lat.note)} <span class="${lat.status}">${lat.status === 'ok' ? '✔' : '⚠'}</span>`, '5.9(3)');
  const sf = R.surf;
  if (has(['surf0', 'surf', 'surft', 'surfs'])) {
  o += `<h3>Zbrojenie przypowierzchniowe (9.2.4, zał. J.1)</h3>`;
  if (!sf.req) o += line(`Nie jest wymagane: największa średnica pręta / zastępcza wiązki ⌀ = ${f(sf.dmax, 1)} mm ≤ 32 mm oraz c<sub>nom</sub> = ${sf.cnom} mm ≤ 70 mm.`, '9.2.4');
  else if (sf.gov) {
    const q = sf.gov;
    o += line(`Wymagane: ${[sf.byBar ? `⌀ = ${f(sf.dmax, 1)} mm > 32 mm` : '', sf.byCover ? `c<sub>nom</sub> = ${sf.cnom} mm > 70 mm` : ''].filter(Boolean).join('; ')} – siatka na zewnątrz strzemion, oczko ≤ 150 mm.`, '9.2.4');
    o += eq('A_{ct,ext}', 'b_{w}·c_{nom} + 2·c_{nom}·(h − x − c_{nom})', `${g.bw}·${sf.cnom} + 2·${sf.cnom}·(${g.h} − ${f(q.x, 0)} − ${sf.cnom}) – ${esc(q.sec.loc)}`, f(q.Act, 0), 'mm²', 'J.1');
    if (has(['surf'])) o += eq('A_{s,surf,req}', `${sf.rho === 0.01 ? '0,01' : '0,005'}·A_{ct,ext}`, '', f(sf.AsReq, 0), 'mm²') + eq('A_{s,surf,prov}', `⌀${S.surf.d} co ${S.surf.s} mm na obwodzie strefy rozciąganej ${f(q.per, 0)} mm`, '', f(sf.AsProv, 0), 'mm²') + cmp(sf.AsReq, '≤', sf.AsProv, 'mm² (w obu kierunkach)', 0);
    if (has(['surft'])) o += eq('a_{s,surf,⊥}', `${sf.rho === 0.01 ? '0,01' : '0,005'}·c_{nom}·1000`, '', f(sf.perMReq, 0), 'mm²/m') + cmp(sf.perMReq, '≤', sf.perM, `mm²/m (pręty poprzeczne ⌀${S.surf.d} co ${S.surf.s} mm)`, 0);
    if (has(['surfs'])) o += cmp(S.surf.s, '≤', 150, 'mm (oczko siatki)', 0);
  }
  }
  }

  /* ---------------- 9. SGU */
  const sl = R.sls, cs = sl.cs;
  const showSLS = has(['sck', 'scqp', 'ssk', 'ascr', 'wk', 'f', 'ld', 'fz']);
  if (showSLS) {
  o += H2('SGU – parametry reologiczne (zał. B)');
  o += eq('h_{0}', '2·A_{c}/u', `2·${f(g.Ac, 0)}/${f(g.u, 0)}`, f(cs.h0, 1), 'mm') + line(`RH = ${cs.RH}%, t<sub>0</sub> = ${cs.t0} dni, cement klasy ${cs.cem}, t = ${cs.tInf ? '∞' : f(cs.t, 0) + ' dni'}`);
  o += eq('φ_{RH}', m.fcm <= 35 ? '1 + (1 − RH/100)/(0,1·h_{0}^{1/3})' : '[1 + (1 − RH/100)/(0,1·h_{0}^{1/3})·α_{1}]·α_{2}', '', f(cs.phiRH, 3), '', '(B.3)');
  o += eq('β(f_{cm})', '16,8/√f_{cm}', '', f(cs.bfcm, 3), '', '(B.4)') + eq('β(t_{0})', '1/(0,1 + t_{0,adj}^{0,20})', `t_{0,adj} = ${f(cs.t0adj, 2)}`, f(cs.bt0, 3), '', '(B.5, B.9)');
  o += eq('φ_{0}', 'φ_{RH}·β(f_{cm})·β(t_{0})', '', f(cs.phi0, 3), '') + (cs.tInf ? '' : eq('β_{c}(t,t_{0})', '', `β_{H} = ${f(cs.betaH, 0)}`, f(cs.bc, 3), ''));
  o += eq('φ(t,t_{0})', S.sls.phiSel === 'manual' ? 'przyjęto ręcznie' : 'φ_{0}·β_{c}(t,t_{0})', '', f(cs.phi, 3), '', '(B.1)');
  if (sl.phiNL) o += line(`σ<sub>c,qp</sub>/f<sub>ck</sub> = ${f(sl.ksig, 3)} > 0,45 → pełzanie nieliniowe: φ<sub>nl</sub> = φ·exp(1,5·(k<sub>σ</sub> − 0,45)) = <b>${f(sl.phiNL, 3)}</b>`, '(3.7)');
  o += eq('ε_{cd,0}', '0,85·[(220 + 110·α_{ds1})·exp(−α_{ds2}·f_{cm}/f_{cm0})]·10^{−6}·β_{RH}', `β_{RH} = ${f(cs.betaRH, 3)}`, f(cs.ecd0 * 1e6, 1) + '·10<sup>−6</sup>', '', '(B.11)');
  o += eq('ε_{cd}', 'β_{ds}·k_{h}·ε_{cd,0}', `${f(cs.bds, 3)}·${f(cs.kh, 3)}·${f(cs.ecd0 * 1e6, 1)}·10^{−6}`, f(cs.ecd * 1e6, 1) + '·10<sup>−6</sup>', '', '(3.9)');
  o += eq('ε_{ca}', 'β_{as}·2,5·(f_{ck} − 10)·10^{−6}', '', f(cs.eca * 1e6, 1) + '·10<sup>−6</sup>', '', '(3.11, 3.12)') + eq('ε_{cs}', 'ε_{cd} + ε_{ca}', '', f(cs.ecs * 1e6, 1) + '·10<sup>−6</sup>', '', '(3.8)');
  o += eq('E_{c,eff}', 'E_{cm}/(1 + φ)', `${f(m.Ecm, 0)}/(1 + ${f(cs.phi, 3)})`, f(sl.Eeff, 0), 'MPa', '(7.20)') + eq('α_{e}', 'E_{s}/E_{cm}', '', f(sl.aeS, 3), '') + eq('α_{e,t}', 'E_{s}/E_{c,eff}', '', f(sl.aeL, 3), '');
  }

  if (has(['sck', 'scqp', 'ssk'])) o += H2('SGU – naprężenia (7.2)');
  R.secs.forEach(sec => {
    const r = sec.sls, nm = esc(cap(sec.loc));
    if (!r || r.Mk <= 0 || !has(['sck', 'scqp', 'ssk'], sec.key)) return;
    o += `<h3>${nm}: M<sub>Ek</sub> = ${f(r.Mk / 1e6, 2)} kNm, M<sub>Eqp</sub> = ${f(r.Mqp / 1e6, 2)} kNm</h3>`;
    o += eq('M_{cr}', 'f_{ctm}·I_{I}/(h − x_{I})', `${f(m.fctm, 2)}·${f(r.unS.I / 1e8, 1)}·10^{8}/(${g.h} − ${f(r.unS.yc, 1)})`, f(r.Mcr / 1e6, 2), 'kNm');
    o += line(`Przekrój w fazie II (bez betonu rozciąganego): x<sub>II</sub> = ${f(r.crS.x, 1)} mm (α<sub>e</sub>), ${f(r.crL.x, 1)} mm (α<sub>e,t</sub>); I<sub>II</sub> = ${f(r.crS.I / 1e8, 1)}·10⁸ / ${f(r.crL.I / 1e8, 1)}·10⁸ mm⁴`);
    o += eq('σ_{c}', 'M_{Ek}·x_{II}/I_{II}', '(obwiednia α_{e} / α_{e,t})', f(r.sc_k, 2), 'MPa') + cmp(r.sc_k, '≤', S.coef.k1 * m.fck, `MPa = k₁·f<sub>ck</sub>${sl.k1lim ? '' : ' (informacyjnie – wymagane dla XD/XF/XS)'}`, 2);
    o += eq('σ_{c,qp}', '', 'przy obciążeniu quasi-stałym, α_{e}', f(r.sc_qp, 2), 'MPa') + cmp(r.sc_qp, '≤', S.coef.k2 * m.fck, 'MPa = k₂·f<sub>ck</sub>', 2);
    o += eq('σ_{s}', 'α_{e}·M_{Ek}·(d − x_{II})/I_{II}', '', f(r.ss_k, 1), 'MPa') + cmp(r.ss_k, '≤', S.coef.k3 * m.fyk, 'MPa = k₃·f<sub>yk</sub>', 1);
    if (r.biax) o += line(`Uwzględniono zginanie ukośne (M<sub>y</sub> + M<sub>z</sub>): naprężenia z analizy sprężystej przekroju zarysowanego (beton nie przenosi rozciągania, oś obojętna ukośna) – wartości maksymalne w narożach.`);
  });

  if (has(['ascr', 'wk'])) o += H2('SGU – zarysowanie (7.3)');
  R.secs.forEach(sec => {
    const r = sec.sls, nm = esc(cap(sec.loc));
    if (!r || r.Mk <= 0 || !has(['ascr', 'wk'], sec.key)) return;
    const w = r.w, a = r.asmin;
    o += `<h3>${nm}</h3>`;
    o += eq('k', '', `h = ${g.h} mm`, f(a.k, 3), '', '7.3.2(2)');
    a.parts.forEach(p => { o += line(`${p.name}: k<sub>c</sub> = ${f(p.kc, 3)}, A<sub>ct</sub> = ${f(p.Act, 0)} mm²`); });
    o += eq('A_{s,min}', 'Σk_{c}·k·f_{ct,eff}·A_{ct}/σ_{s}', `σ_{s} = f_{yk} = ${m.fyk} MPa`, f(a.As, 0), 'mm²', '(7.1)') + cmp(a.As, '≤', r.AsProv, 'mm²', 0);
    if (!r.crackedQP) { o += line(`M<sub>Eqp</sub> = ${f(r.Mqp / 1e6, 2)} kNm ≤ M<sub>cr</sub> = ${f(r.Mcr / 1e6, 2)} kNm → przekrój niezarysowany pod obciążeniem quasi-stałym, w<sub>k</sub> = 0`); return; }
    o += eq('h_{c,ef}', 'min\\{2,5·(h − d); (h − x)/3; h/2\\}'.replace(/\\/g, ''), `min{${f(2.5 * (g.h - r.d), 1)}; ${f((g.h - w.x) / 3, 1)}; ${f(g.h / 2, 1)}}`, f(w.hcef, 1), 'mm', '7.3.2(3)');
    o += eq('ρ_{p,eff}', 'A_{s}/A_{c,eff}', `${f(w.As, 0)}/${f(w.Aceff, 0)}`, f(w.rho, 5), '', '(7.10)');
    o += eq('σ_{s}', '', `M_{Eqp} = ${f(r.Mqp / 1e6, 2)} kNm, faza II, α_{e,t}`, f(w.ss, 1), 'MPa');
    o += eq('ε_{sm} − ε_{cm}', '[σ_{s} − k_{t}·f_{ct,eff}/ρ_{p,eff}·(1 + α_{e}·ρ_{p,eff})]/E_{s} ≥ 0,6·σ_{s}/E_{s}', `max{${f(w.eps1 * 1e3, 4)}; ${f(w.eps2 * 1e3, 4)}}‰`, f(w.eps * 1e3, 4), '‰', '(7.9)');
    o += eq('⌀_{eq}', '', '', f(w.phiEq, 1), 'mm') + eq('c', 'c_{nom} + ⌀_{w}', '', f(w.c, 0), 'mm');
    o += w.wide ? eq('s_{r,max}', '1,3·(h − x)', `rozstaw ${f(w.spacing, 0)} mm > 5·(c + ⌀/2) = ${f(w.spLim, 0)} mm`, f(w.sr, 1), 'mm', '(7.14)')
      : eq('s_{r,max}', 'k_{3}·c + k_{1}·k_{2}·k_{4}·⌀/ρ_{p,eff}', `3,4·${f(w.c, 0)} + 0,8·0,5·0,425·${f(w.phiEq, 1)}/${f(w.rho, 5)}`, f(w.sr, 1), 'mm', '(7.11)');
    o += eq('w_{k}', 's_{r,max}·(ε_{sm} − ε_{cm})', '', f(w.wk, 3), 'mm', '(7.8)') + cmp(w.wk, '≤', sl.wmax, 'mm = w<sub>max</sub> (tab. 7.1N)', 3);
    o += `<p class="note">Kontrola bez bezpośredniego obliczania (informacyjnie): przy σ<sub>s</sub> = ${f(w.ss, 0)} MPa – ⌀*<sub>s</sub> = ${f(w.phiStar, 0)} mm (tab. 7.2N), ⌀<sub>s,max</sub> = ${f(w.phiMax, 1)} mm (7.6N); s<sub>max</sub> = ${f(w.sMaxT, 0)} mm (tab. 7.3N).</p>`;
  });

  const d = sl.defl;
  const spF = d.spans.filter(q => has(['f'], 'd' + q.seg.idx));
  if (has(['f', 'ld', 'fz'])) o += H2('SGU – ugięcia (7.4)');
  if (spF.length) {
  o += `<h3>Metoda dokładna – całkowanie krzywizn (7.4.3)</h3>`;
  o += line(`Krzywizna od obciążenia: 1/r = ζ·M/(E<sub>c,eff</sub>·I<sub>II</sub>) + (1 − ζ)·M/(E<sub>c,eff</sub>·I<sub>I</sub>), ζ = 1 − β·(M<sub>cr</sub>/M)², β = 0,5`, '(7.18, 7.19)');
  o += line(`Krzywizna od skurczu: 1/r<sub>cs</sub> = ε<sub>cs</sub>·α<sub>e,t</sub>·S/I (interpolacja ζ jak wyżej)`, '(7.21)');
  const prow = (nm, p) => [nm, f(p.I1 / 1e8, 2), f(p.I2 / 1e8, 2), f(p.Mcr / 1e6, 1), f(p.k1cs * 1e6, 3), f(p.k2cs * 1e6, 3)];
  md.segs.map((sg, i) => prow(`${esc(cap(sg.label))} (M > 0)`, d.pS[i])).concat(md.sups.filter(p => p.sec).map(p => prow(`${esc(cap(p.name))} (M < 0)`, d.pH[p.idx]))).forEach(r => { o += line(`${r[0]}: I<sub>I</sub> = ${r[1]}·10⁸ mm⁴, I<sub>II</sub> = ${r[2]}·10⁸ mm⁴, M<sub>cr</sub> = ${r[3]} kNm, 1/r<sub>cs,I</sub> = ${r[4]}·10⁻⁶/mm, 1/r<sub>cs,II</sub> = ${r[5]}·10⁻⁶/mm`); });
  o += `<p class="note">${st.manual ? 'Ugięcie w środku przęsła względem cięciwy podpór wyznaczono z twierdzenia redukcyjnego (całkowanie numeryczne krzywizn).' : 'Linię ugięcia wyznaczono MES z iteracyjną aktualizacją sztywności siecznej elementów (uwzględnia redystrybucję momentów od zarysowania w układach statycznie niewyznaczalnych).'}${d.patterned ? ' Obciążenia zmienne (część quasi-stała) przyłożono na przęsłach naprzemiennych – dla każdego przęsła przyjęto układ dający jego największe ugięcie.' : ''}</p>`;
  spF.forEach(q => { o += line(`${esc(cap(q.label))}${q.seg.kind !== 'span' ? ' (L<sub>ref</sub> = 2·l)' : ''}: f<sub>qp</sub> = ${f(q.load.f, 2)} mm, f<sub>cs</sub> = ${f(q.cs, 2)} mm → f = f<sub>qp</sub> + f<sub>cs</sub> = <b>${f(q.tot.f, 2)} mm</b> ${q.tot.f <= q.lim + 1e-9 ? '≤' : '>'} f<sub>lim</sub> = L<sub>ref</sub>/${S.sls.lim} = ${f(q.lim, 2)} mm ${q.tot.f <= q.lim + 1e-9 ? '<span class="ok">✔</span>' : '<span class="fail">✖</span>'}`, '7.4.1'); });
  o += `<p class="note">Ugięcie graniczne L/${S.sls.lim}: L/250 – wygląd i ogólna użytkowalność (7.4.1(4)); L/500 – ugięcie po wykonaniu elementów wrażliwych na uszkodzenia (7.4.1(5)).</p>`;
  spF.forEach(q => { if (q.ch) o += line(`${esc(cap(q.label))}: ugięcie natychmiastowe od obciążenia charakterystycznego (E<sub>cm</sub>, ${esc(d.chName || '')}): ${f(q.ch.f, 2)} mm (informacyjnie).`); });
  o += `<div class="fig">${U.lineChart({ W: 900, H: 190, title: 'Linia ugięcia w(x) [mm]', yl: 'w [mm]', series: [{ x: d.x.map(v => v / 1000), y: d.w, c: '#1d5bb8', l: 'w(x)', w: 1.8, fill: 'rgba(29,91,184,.08)' }].concat(d.wz && d.wz.some(v => v > 1e-3) ? [{ x: d.x.map(v => v / 1000), y: d.wz.map(v => -v), c: '#1d7f3c', l: '|w_z(x)|', w: 1.4, dash: '5 3' }] : []), hl: [{ y: -Math.min(...d.spans.map(q => q.lim)), l: '−f_lim', c: '#c0262d' }], vl: md.sups.map(p => ({ x: p.x / 1000 })) })}</div>`;
  }
  const zT = (d.z || []).filter(q => has(['fz'], 'd' + q.seg.idx));
  if (zT.length) {
    o += `<h3>Ugięcie poziome – płaszczyzna Z</h3>`;
    o += line(`Przekrój „obrócony” (zginanie względem osi pionowej), interpolacja ζ; część długotrwała (quasi-stała, E<sub>c,eff</sub>) + przyrost od kombinacji charakterystycznej (E<sub>cm</sub>); skurcz pominięto (symetria).`);
    zT.forEach(q => { o += line(`${esc(cap(q.label))}: f<sub>z</sub> = <b>${f(q.f, 2)} mm</b> ${q.f <= q.lim + 1e-9 ? '≤' : '>'} f<sub>lim</sub> = ${f(q.lim, 2)} mm ${q.f <= q.lim + 1e-9 ? '<span class="ok">✔</span>' : '<span class="warn">⚠</span>'}`); });
  }
  if (has(['ld'])) o += `<h3>Metoda uproszczona – smukłość L/d (7.4.2), informacyjnie</h3>`;
  d.spans.forEach(q => {
    if (!has(['ld'], 'd' + q.seg.idx)) return;
    const ld = q.ld;
    if (multi) o += `<p><b>${esc(cap(q.label))}</b></p>`;
    if (!ld) { o += `<p>Brak przekroju wymiarującego dla tego odcinka.</p>`; return; }
    if (!isFinite(ld.lim)) { o += `<p>Zbrojenie rozciągane nie jest wymagane obliczeniowo (A<sub>s,req</sub> = 0) – metoda uproszczona nie ma zastosowania.</p>`; return; }
    o += eq('ρ_{0}', '√f_{ck}·10^{−3}', '', f(ld.rho0 * 100, 3), '%') + eq('ρ', 'A_{s,req}/A_{c,ref}', '', f(ld.rho * 100, 3), '%') + (ld.rhoP > 0 ? eq("ρ'", '', '', f(ld.rhoP * 100, 3), '%') : '');
    o += eq('(L/d)_{bazowe}', ld.rho <= ld.rho0 ? 'K·[11 + 1,5·√f_{ck}·ρ_{0}/ρ + 3,2·√f_{ck}·(ρ_{0}/ρ − 1)^{3/2}]' : "K·[11 + 1,5·√f_{ck}·ρ_{0}/(ρ − ρ') + √f_{ck}/12·√(ρ'/ρ_{0})]", `K = ${f(ld.K, 1)}`, f(ld.base, 2), '', ld.rho <= ld.rho0 ? '(7.16a)' : '(7.16b)');
    o += eq('(L/d)_{lim}', '(L/d)_{bazowe}·min(500/(f_{yk}·A_{s,req}/A_{s,prov}); 1,5)' + (ld.fT < 1 ? '·0,8' : '') + (ld.fL < 1 ? '·7/L' : ''), `${f(ld.base, 2)}·${f(ld.fS, 3)}${ld.fT < 1 ? '·0,8' : ''}${ld.fL < 1 ? '·' + f(ld.fL, 3) : ''}`, f(ld.lim, 2), '', '(7.17)');
    o += line(`L/d = ${f(q.seg.L, 0)}/${f(ld.d, 0)} = <b>${f(ld.act, 2)}</b> ${ld.act <= ld.lim ? '≤' : '>'} ${f(ld.lim, 2)} <span class="${ld.act <= ld.lim ? 'ok' : 'warn'}">${ld.act <= ld.lim ? '✔' : '⚠ decyduje metoda dokładna'}</span>`);
  });

  /* ---------------- pożar */
  if (R.fire && has(['fb', 'fa', 'fasd', 'fbw'])) {
    const fr = R.fire;
    o += H2(`Odporność ogniowa ${fr.R} (PN-EN 1992-1-2, tab. ${fr.cont ? '5.6 – belki ciągłe' : '5.5 – belki swobodnie podparte'})`);
    o += line(`Kombinacje b<sub>min</sub> / a [mm]: ${fr.tab.c.map(c => `${c[0]} / ${c[1]}`).join(' · ')}; b<sub>w,min</sub> (WA) = ${fr.tab.bw} mm`);
    o += cmp(fr.bmin, '≤', fr.b, 'mm (b<sub>min</sub> ≤ b)', 0);
    if (fr.amin !== null) {
      o += eq('a_{min}', '', `interpolacja dla b = ${fr.b} mm`, f(fr.amin, 1), 'mm') + eq('a_{m}', 'ΣA_{si}·a_{i}/ΣA_{si}', '', f(fr.am, 1), 'mm') + cmp(fr.amin, '≤', fr.am, 'mm', 1);
      if (fr.needAsd) o += eq('a_{sd}', 'c_{nom} + ⌀_{w} + ⌀/2', '', f(fr.asd, 1), 'mm') + cmp(fr.asdReq, '≤', fr.asd, 'mm (a<sub>sd</sub> ≥ a + 10 mm)', 1);
    }
  }

  /* ---------------- zestawienie */
  const sc = E.steelSchedule(R);
  o += H2('Zbrojenie belki – widok podłużny i zestawienie stali') + `<p class="note">Rysunek poglądowy (skala pionowa powiększona); numery pozycji w kółkach odpowiadają zestawieniu stali. Długości osiowe z odgięciami i hakami; φm – średnica trzpienia gięcia.</p><div class="fig">${U.elevationSVG(940)}</div>`;
  o += `<h3>Zestawienie stali</h3>` + sc.rows.map(r => line(`Poz. ${r.pos} – ${esc(r.name)}: ${r.n} × ⌀${r.d}, l = ${f(r.len / 1000, 2)} m${r.rL || r.rR ? `, gięcie φ<sub>m</sub> = ${f(2 * Math.max(r.rL || 0, r.rR || 0), 0)} mm` : ''}${r.set ? `, φ<sub>m</sub> = ${f(r.set.phm, 0)} mm, haki 135° ${f(r.set.ext, 0)} mm` : ''} → L = ${f(r.tot, 2)} m, masa ${f(r.mass, 1)} kg`)).join('');
  o += line(`Razem: ${Object.keys(sc.byD).map(Number).sort((a, b) => a - b).map(dd => `⌀${dd} – ${f(sc.byD[dd], 1)} kg`).join('; ')}; <b>masa całkowita ${f(sc.total, 1)} kg</b>; objętość betonu ${f(sc.vol, 3)} m³; wskaźnik ${f(sc.total / sc.vol, 0)} kg/m³`);
  if (sc.laps && sc.laps.length) o += `<h3>Zakłady prętów (8.7)</h3>` + sc.laps.map(l => line(`${l.side === 'top' ? 'Pręty górne ciągłe' : l.mid ? 'Pręty boczne' : `Pręty dolne – ${esc(md.segs[l.seg].label)}`}: pręty dłuższe od ${f(sc.Lmax / 1000, 0)} m łączone na zakład w x = ${f(l.a / 1000, 2)} ÷ ${f(l.b / 1000, 2)} m, l<sub>0</sub> = <b>${l.l0} mm</b> – ${l.mid ? 'pręty konstrukcyjne' : `w miejscu najmniejszego momentu rozciągającego te pręty (max |M<sub>Ed</sub>| na długości zakładu = ${f(l.M / 1e6, 1)} kNm)`}`, '8.7.3')).join('');

  /* ---------------- podsumowanie – tylko sprawdzenia odhaczone */
  o += H2('Zestawienie sprawdzeń');
  if (!ticked.length) o += `<p class="note">Brak odhaczonych sprawdzeń – zaznacz sprawdzenia w zakładce Podsumowanie, aby pojawiły się w raporcie.</p>`;
  else {
    let grp = '';
    ticked.forEach(c => {
      if (c.grp !== grp) { grp = c.grp; o += `<h3>${esc(grp)}</h3>`; }
      const cond = U.ckCond(c);
      o += line(`${sym(c.name)}${cond ? `: ${cond}` : ''}${c.status === 'info' || !isFinite(c.ratio) ? '' : `, η = ${f(c.ratio * 100, 0)}%`} – <span class="${c.status}">${U.STL[c.status]}</span>`, c.ref);

        else if (pc.type === 'pin') { const list = []; if (set.kind === 'pins') for (let j = 1; j < set.legs - 1; j++) list.push(legX(j)); else list.push((a0 + a1) / 2); list.forEach(xx => { D.line(X(xx), Y(b0), X(xx), Y(b1), 'STRZEMIONA'); D.line(X(xx), Y(b0), X(xx) + eh / k, Y(b0) - eh / k, 'STRZEMIONA'); D.line(X(xx), Y(b1), X(xx) - eh / k, Y(b1) + eh / k, 'STRZEMIONA'); }); }
