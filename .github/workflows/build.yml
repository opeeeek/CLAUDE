name: Testy i budowa BM-Win.exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Testy silnika obliczeniowego
        run: npm test
      - name: Budowa BM-Win.exe
        run: tools/build-exe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BM-Win-exe
          path: dist/BM-Win.exe
